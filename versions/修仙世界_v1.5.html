<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙世界 · 三界录</title>
<style>
  :root{
    --ink:#2b2118; --ink2:#5a4a36; --paper:#f3e9d2; --paper2:#e9dcbf;
    --seal:#9e2b25; --gold:#9c7a2e; --line:#c9b48a; --good:#2f6b3a; --bad:#9e2b25;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Kaiti","STKaiti","楷体","Songti SC",serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(180,150,100,.25), transparent 50%),
      var(--paper);
    color:var(--ink); line-height:1.6;}
  #app{max-width:1180px;margin:0 auto;padding:14px;}
  h1,h2,h3{font-weight:700;letter-spacing:2px;margin:.2em 0}
  .seal{color:var(--seal)}
  .frame{border:2px solid var(--line);border-radius:8px;background:rgba(255,255,255,.35);
    box-shadow:0 2px 10px rgba(120,90,40,.18) inset, 0 1px 0 #fff;}
  /* 创建界面 */
  #create{padding:22px}
  #create .row{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0}
  #create label{display:flex;flex-direction:column;font-size:14px;color:var(--ink2)}
  #create input,#create select{padding:6px 8px;border:1px solid var(--line);border-radius:5px;
    background:#fff8ec;font-family:inherit;font-size:15px;color:var(--ink);margin-top:3px}
  .sectitle{border-left:5px solid var(--seal);padding-left:10px;margin-top:18px;color:var(--seal)}
  .btn{cursor:pointer;border:1px solid var(--seal);background:var(--seal);color:#fff8ec;
    padding:8px 16px;border-radius:6px;font-family:inherit;font-size:15px;letter-spacing:1px;
    transition:.15s; box-shadow:0 2px 0 #6f1d19}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--seal)}
  .btn.sm{padding:5px 10px;font-size:13px}
  /* 游戏界面 */
  #game{display:none;grid-template-columns:300px 1fr 250px;gap:12px}
  @media(max-width:1000px){#game{grid-template-columns:1fr}}
  .panel{padding:12px;max-height:82vh;overflow:auto}
  #topbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    padding:10px 14px;font-size:14px}
  #topbar b{color:var(--seal)}
  .stat-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px}
  .bar{height:9px;background:#d8c7a0;border-radius:5px;overflow:hidden;margin:2px 0 6px}
  .bar>i{display:block;height:100%}
  .hp>i{background:linear-gradient(90deg,#c0392b,#e74c3c)}
  .mp>i{background:linear-gradient(90deg,#2471a3,#5dade2)}
  .en>i{background:linear-gradient(90deg,#b7950b,#f1c40f)}
  .sh>i{background:linear-gradient(90deg,#6c3483,#bb8fce)}
  #log{height:52vh;overflow:auto;padding:12px;font-size:15px}
  #log .line{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
  #log .ev{color:var(--seal);border-color:var(--seal)}
  #log .good{color:var(--good);border-color:var(--good)}
  #log .bad{color:var(--bad);border-color:var(--bad)}
  #log .sys{color:var(--ink2);font-style:italic;border-color:#d8c7a0}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .free{display:flex;gap:8px;margin-top:10px}
  .free input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;
    background:#fff8ec;font-family:inherit;font-size:14px}
  .mapbtn{display:block;width:100%;text-align:left;margin:4px 0;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.4);padding:6px 9px;border-radius:5px;
    font-family:inherit;font-size:13px;color:var(--ink)}
  .mapbtn:hover{background:#fff3dc}
  .mapbtn.cur{background:var(--seal);color:#fff8ec;border-color:var(--seal)}
  .bag{font-size:12px;max-height:30vh;overflow:auto}
  .bag div{padding:2px 0;border-bottom:1px dashed var(--line)}
  .small{font-size:12px;color:var(--ink2)}
  .tag{display:inline-block;background:var(--gold);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;margin-right:4px}
  .tag.r{background:var(--seal)}
  .modal{position:fixed;inset:0;background:rgba(40,30,20,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{width:min(640px,92vw);max-height:88vh;overflow:auto;padding:18px;background:var(--paper);border:2px solid var(--seal);border-radius:10px}
  .shopitem{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:6px;border-bottom:1px dashed var(--line);font-size:14px}
  .center{text-align:center}
  .mtip{color:var(--seal);font-size:13px;margin:6px 0}
  .winbig{font-size:22px;color:var(--seal);text-align:center;margin:10px 0}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 角色创建 ============ -->
  <div id="create" class="frame">
    <h1 class="center">✦ 修仙世界 · 三界录 ✦</h1>
    <p class="center small" id="verLine"></p>

    <div class="sectitle">🗂 选档 / 继承</div>
    <div class="row" id="slotRow">
      <button class="btn sm" id="slotBtn1" onclick="pickSlot(1)">档位1</button>
      <button class="btn sm ghost" id="slotBtn2" onclick="pickSlot(2)">档位2</button>
      <button class="btn sm ghost" id="slotBtn3" onclick="pickSlot(3)">档位3</button>
      <button class="btn sm ghost" onclick="openSlots()">管理档位</button>
      <button class="btn sm" onclick="openInherit()">❖ 继承开局</button>
    </div>
    <div class="small" id="slotHint" style="margin-top:-4px"></div>

    <div class="sectitle">✦ 开局模式</div>
    <div class="row">
      <button class="btn sm" id="mDetail" onclick="selectMode('detail')">🖋 详细创建（自选天赋·灵根·职业）</button>
      <button class="btn sm ghost" id="mQuick" onclick="selectMode('quick')">🎲 快速开局（仅填姓名性别，其余随机）</button>
    </div>

    <div class="sectitle">① 基础信息</div>
    <div class="row">
      <label>姓名<input id="c_name" value="王狗儿" maxlength="8"></label>
      <label>性别<select id="c_sex"><option>男</option><option>女</option></select></label>
    </div>

    <div id="detailFields">
      <div class="row">
        <label>年龄<input id="c_age" type="number" value="18" min="8" max="80"></label>
      </div>

      <div class="sectitle">② 出身 / 势力</div>
      <div class="row">
        <label>身份（决定初始资源与剧情起点）
          <select id="c_origin">
            <option value="宗门弟子">宗门弟子（上三宗/下三宗）</option>
            <option value="世家子弟">修仙世家子弟</option>
            <option value="散修">散修（无门无派）</option>
            <option value="凡人平民">凡人平民</option>
            <option value="妖修">妖修（妖界出身）</option>
            <option value="魔修">魔修（魔界出身）</option>
          </select>
        </label>
      </div>

      <div class="sectitle">③ 修行资质</div>
      <div class="row">
        <label>灵根属性
          <select id="c_root">
            <option>金</option><option>木</option><option>水</option><option>火</option>
            <option>土</option><option>风</option><option>雷</option><option>光</option>
            <option>暗</option><option>杂灵根（多属性）</option>
          </select>
        </label>
        <label>灵根品级
          <select id="c_rootq">
            <option value="天灵根">天灵根（单属性·修炼最快）</option>
            <option value="双灵根">双灵根</option>
            <option value="三灵根">三灵根</option>
            <option value="四灵根">四灵根</option>
            <option value="五灵根">五灵根（五行俱全）</option>
          </select>
        </label>
        <label>主修职业
          <select id="c_prof">
            <option>剑修</option><option>法修</option><option>体修</option><option>符修</option>
            <option>阵修</option><option>丹修</option><option>药修</option><option>蛊修</option>
            <option>器修</option><option>妖修</option><option>魔修</option>
          </select>
        </label>
      </div>
      <p class="mtip small">提示：天灵根→根骨/悟性更高；杂灵根→福缘更高但修炼慢。职业决定战斗风格，详见游戏内说明。</p>
    </div>
    <div class="center" style="margin-top:10px">
      <button class="btn" onclick="startGame()">✦ 确认入世，开始游戏 ✦</button>
    </div>
  </div>

  <!-- ============ 游戏主界面 ============ -->
  <div id="game">
    <div id="topbar" class="frame">
      <span>⏳ <b id="t_time"></b></span>
      <span>📍 <b id="t_loc"></b></span>
      <span>🌤 <b id="t_weather"></b></span>
      <span id="t_realm" class="tag r"></span>
      <span style="flex:1"></span>
      <button class="btn sm ghost" onclick="saveGame()">存档</button>
      <button class="btn sm ghost" onclick="openSlots()">选档</button>
      <button class="btn sm ghost" onclick="openRecall()">回忆</button>
      <button class="btn sm ghost" onclick="openHelp()">玩法</button>
      <button class="btn sm ghost" onclick="openHome()">🏮 返回主页</button>
    </div>

    <!-- 左：状态 -->
    <div class="panel frame" id="statusPanel"></div>

    <!-- 中：剧情/日志 -->
    <div class="frame" style="display:flex;flex-direction:column">
      <div id="log"></div>
      <div class="choices" id="choices"></div>
      <div class="free">
        <input id="freeInput" placeholder="自由行动，例如：修炼 / 前往长安城 / 采药 / 出手 / 逃跑 / 使用疗伤丹" onkeydown="if(event.key==='Enter')sendFree()">
        <button class="btn" onclick="sendFree()">行动</button>
      </div>
    </div>

    <!-- 右：地图 + 背包 -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="panel frame">
        <h3 class="seal">🗺 三界舆图</h3>
        <div id="map"></div>
      </div>
      <div class="panel frame">
        <h3 class="seal">🎒 行囊</h3>
        <div class="bag" id="bag"></div>
      </div>
    </div>
  </div>

</div>

<!-- 商店/模态 -->
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

function realmStats(){

  let blood=0; if(S.wp) S.wp.forEach(g=>{ if(GONGS[g]&&GONGS[g].attr==='血') blood+=0.04*(S.gongLv[g]||1); });
  return {
    hp: Math.round(r.hp*m*(1+(S.rootq==='天灵根'?0.1:0))*(1+blood)),
    mp: Math.round(r.mp*m),
    shen: Math.round(r.shen*m),
    shou: r.shou
  };
}

function sendFree(){
  const v=document.getElementById('freeInput').value.trim();
  document.getElementById('freeInput').value='';
  if(!v) return;
  parseCmd(v);
}
function parseCmd(v){
  const t=v.replace(/\s/g,'');
  if(/修炼|打坐|吐纳/.test(t)) return doCultivate();
  if(/功法|换功|参悟|易修/.test(t)) return doCultivate();
  if(/突破/.test(t)) return tryBreak();
  if(/前往|去|出发|传送/.test(t)){
    for(const id in LOCATIONS){ if(LOCATIONS[id].name.includes(t.replace(/前往|去|出发|传送/g,''))||t.includes(LOCATIONS[id].name)) return travelTo(id); }
    return log('未找到该地点，或此地从当前位置无法直接抵达。','sys');
  }
  if(/探索|游历|走动|查看/.test(t)) return explore();
  if(/采药|采集|寻草|挖草/.test(t)) return gather();
  if(/出手|攻击|战斗|杀|迎战|御敌/.test(t)) return combatAction('attack');
  if(/技能|施法/.test(t)) return combatAction('skill');
  if(/防御|守|硬抗/.test(t)) return combatAction('defend');
  if(/逃跑|遁走|撤退|逃/.test(t)) return combatAction('flee');
  if(/休息|睡觉|睡眠|调息/.test(t)) return rest();
  if(/商店|买卖|交易|shop/i.test(t)) return openShop();
  if(/归家|双亲|探望/.test(t)) return familyVisit();
  if(/社交|结识|道侣/.test(t)) return social();
  if(/炼丹|丹房|炼制/.test(t)) return openRefine();
  if(/比武|擂台|大会/.test(t)) return tournament();
  if(/狩猎|猎兽|灵兽/.test(t)) return beastHunt();
  if(/主页|返回主页|退出/.test(t)) return openHome();
  if(/回忆/.test(t)) return openRecall();
  if(/选档|档位/.test(t)) return openSlots();
  if(/用物|运物|道具/.test(t)){ if(COMBAT) return combatItemMenu(); const m=t.match(/用物?(.+)/); return m?useItemByName(m[1]):log('欲用何物？','sys'); }
  if(/使用|服|吃|用/.test(t)){ const m=t.match(/使用?(.+)/); if(m) return useItemByName(m[1]); }
  if(/存档/.test(t)) return saveGame();
  if(/读档/.test(t)) return loadGame();
  if(/状态|属性/.test(t)){ renderAll(); return log('已刷新状态面板。','sys'); }
  log('你欲「'+v+'」，然天地间无此道法可循。可试：修炼 / 前往某地 / 探索 / 采药 / 出手 / 休息 / 商店。','sys');
}

/* ===================== 时间 ===================== */
const WEATHERS=['晴','阴','雨','雪','雾','雷雨','酷暑','风沙'];
function advanceTime(shichen){
  S.shichen+=shichen;
  while(S.shichen>=12){
    S.shichen-=12; S.day++;
    if(S.day>30){ S.day=1; S.month++;
      if(S.month>12){ S.month=1; S.year++;
        if(S.age>=ADULT_AGE){ S.age++; log('🕰 又是一年春去秋来，你已 '+S.age+' 岁。','sys'); }
      }
    }
  }
  S.weather = (S.loc==='mojie')?'魔煞弥漫':(S.loc==='yaojie')?'灵雾缭绕':pick(WEATHERS);
  // 状态计时
  S.status=S.status.filter(s=>{ if(s.turns!==undefined){ s.turns--; if(s.turns<=0){ log('【状态】'+s.t+'已消散。','good'); return false; } } return true; });
  // 自动机缘判定（战斗中不打断，避免破坏战斗流程）
  if(!COMBAT && S.fu/5 > Math.random()*100){
    log('（福缘引动，似有缘法在侧……）','sys');
    const luck = S.yun>=80?2:1;
    if(luck>1){ if(Math.random()<0.4) epicFortune(); else bigFortune(); }
    else smallFortune();
  }
  renderTop();
}

/* ===================== 时间/行情（V1.4） ===================== */
let MARKET = {mult:1, trend:'平稳'};   // 行情倍率：影响买卖价，每日浮动
function marketRefresh(){
  const r = 0.7 + Math.random()*0.8;          // 0.7~1.5
  MARKET.mult = Math.round(r*100)/100;
  MARKET.trend = r>1.2 ? '旺市（万物价高，宜卖不宜买）' : r<0.9 ? '淡市（万物价低，宜买不宜卖）' : '平稳';
}
// 闭关/岁月流逝：成年后随年长岁；寿元耗尽则坐化。返回 true 表示已坐化
function passYears(n){
  S.year += n;
  if(S.age>=ADULT_AGE) S.age += n;
  S.weather = (S.loc==='mojie')?'魔煞弥漫':(S.loc==='yaojie')?'灵雾缭绕':pick(WEATHERS);
  S.status = S.status.filter(s=>{ if(s.turns!==undefined){ s.turns-=n; return s.turns>0; } return true; });
  if(S.age > REALMS[Math.min(S.ri,8)].shou){
    log('⏳ 你寿元已尽（'+REALMS[Math.min(S.ri,8)].shou+'载），油尽灯枯，于静室中坐化而去。','bad');
    endLife('寿元已尽，坐化'); return true;
  }
  return false;
}

/* ===================== 核心行动 ===================== */
function event_arrive(){
  const L=LOCATIONS[S.loc];
  if(S.ach) S.ach.cities[S.loc]=1;
  settleOrders();   // 抵达新地，结算到期寄售/委托
  log('—— 你来到【'+L.name+'】。'+L.desc,'ev');
  // 是否触发事件
  if(Math.random()<0.55){ randomEvent(); }
  else defaultChoices();
}

function randomEvent(){
  if(S.age<ADULT_AGE){
    log('你年幼，此处并无凶险，唯见'+pick(['市井烟火、草木芬芳','檐下燕雀往来，岁月静好','邻家孩童追逐嬉闹'])+'。','sys');
    return childChoices();
  }
  const r=Math.random();
  if(r<0.4){ startCombat(); }
  else if(r<0.7){ smallFortune(); }
  else {
    log('你行至一处，'+pick(['见古碑残破，石上似有阵纹流转','遇一老者负手而立，目光如电，却未多言','闻摊贩叫卖，市井烟火气十足','望山门巍峨，匾额斑驳，灵气隐隐'])+'。','sys');
    defaultChoices();
  }
}

/* ===================== 幼年成长期（未满及冠之年） ===================== */
function ageUp(n){
  if(S.age>=ADULT_AGE) return;
  S.age=Math.min(ADULT_AGE,S.age+n);
  log('🕰 寒来暑往，你已 '+S.age+' 岁。','sys');
  if(S.age>=ADULT_AGE){
    log('🎋 及冠之礼既成，你已长大成人。自此三界任你行走——远行、采药、历练、姻缘，皆可自主。','ev');
  }
}
function childChoices(){
  const list=[
    {t:'呼吸吐纳，引气入体',act:childCultivate},
    {t:'随双亲识字学艺',act:childStudy},
    {t:'嬉戏玩耍，强健体魄',act:childPlay},
    {t:'出门见见世面',act:childExplore},
  ];
  if(S.family && S.loc===S.family.home) list.push({t:'承欢双亲膝下',act:childFamily});
  list.push({t:'安睡调养',act:rest});
  setChoices(list);
}
// 幼年通用：推进时间 -> 长年纪 -> 刷新；满岁则转入成人行动
function childGrow(n){
  advanceTime(rnd(1,3));
  ageUp(n);
  renderAll();
  if(S.age>=ADULT_AGE){ log('（自今日起，你可远行、采药、历练、社交，亦可行姻缘之事。）','sys'); return defaultChoices(); }
  childChoices();
}
function childCultivate(){
  const g=(0.6+S.wu/90)*rnd(2,4);
  S.prog=clamp(S.prog+g,0,100);
  S.EN=clamp(S.EN-3,0,100);
  S.MP=clamp(S.MP+Math.round(S.maxMP*0.05),0,S.maxMP);
  log('你盘膝吐纳，稚嫩的经脉中竟有一缕灵气游走。修为 +'+g.toFixed(1)+'%（当前 '+Math.round(S.prog)+'%）。','good');
  childGrow(rnd(1,2));
}
function childStudy(){
  S.wu=Math.min(99,S.wu+1);
  log('你随双亲识字明理，见识渐长。悟性 +1（'+S.wu+'）。','good');
  childGrow(rnd(1,2));
}
function childPlay(){
  if(Math.random()<0.5){ S.gen=Math.min(99,S.gen+1); log('你终日奔跑嬉闹，筋骨日渐结实。根骨 +1（'+S.gen+'）。','good'); }
  else { S.fu=Math.min(99,S.fu+1); log('你在山野间疯跑，运气似乎格外好。福缘 +1（'+S.fu+'）。','good'); }
  S.EN=clamp(S.EN+15,0,100);
  childGrow(rnd(1,2));
}
function childExplore(){
  if(S.EN<5){ log('你困倦了，走不动路。','sys'); return childChoices(); }
  S.EN-=5;
  const r=Math.random();
  if(r<0.4){ const g=rnd(1,3); S.gold+=g; log('你在街角捡到 '+g+' 两碎银，欢天喜地藏进怀里。','good'); }
  else if(r<0.7){ const n=pick(LOCATIONS[S.loc].herbs||['聚气草']); S.bag[n]=(S.bag[n]||0)+1; if(S.ach)S.ach.herbs++; log('你在屋后草丛里发现一株【'+n+'】，虽不知何用，也宝贝似的收好。','good'); }
  else log('你趴在墙头，看修士御剑掠过天边，眼中满是向往。','sys');
  childGrow(rnd(1,3));
}
function childFamily(){
  log('你依偎在双亲膝下，听他们讲三界的传闻与旧事。','sys');
  S.HP=clamp(S.HP+Math.round(S.maxHP*0.1),0,S.maxHP);
  S.fu=Math.min(99,S.fu+1);
  childGrow(1);
}

function defaultChoices(){
  if(S.age < ADULT_AGE) return childChoices();   // 幼年：另一套行动，无从谈情斗法
  const list=[
    {t:'打坐修炼（提升修为进度）',act:doCultivate},
    {t:'探索周遭（可能触发奇遇/战斗）',act:explore},
    {t:'采集灵草（按地点产出）',act:gather},
  ];
  if(S.family && S.loc===S.family.home) list.push({t:'归家探望双亲',act:familyVisit});
  if(LOCATIONS[S.loc].shop || S.loc==='changan') list.push({t:'城中社交（结识道侣）',act:social});
  if(LOCATIONS[S.loc].shop){
    list.push({t:'🏆 登台比武大会',act:tournament});
    list.push({t:'🐾 参与狩猎灵兽大赛',act:beastHunt});
  }
  list.push({t:'进城坊市 / 休息调养',act:()=>{ if(LOCATIONS[S.loc].shop) openShop(); else rest(); }});
  setChoices(list);
}

function gongLv(g){ return (S.gongLv&&S.gongLv[g])||1; }
function learnGong(name){
  if(!S.wp) S.wp=[]; if(!S.gongLv) S.gongLv={};
  if(S.wp.includes(name)) return false;
  S.wp.push(name); S.gongLv[name]=1;
  log('📜 你于机缘中习得新功法【'+name+'】！可于「修炼 → 易修换功」设为主修。','good');
  return true;
}
function doCultivate(){
  const list=[
    {t:'运功吐纳（提升修为进度）',act:cultBreathe},
    {t:'参悟主修功法「'+(S.mainGong||'无')+'」（当前Lv'+gongLv(S.mainGong)+'，可至Lv3）',act:cultComprehend},
  ];
  if(S.wp && S.wp.length>1) list.push({t:'易修换功（切换主修功法）',act:cultSwitch});
  list.push({t:'返回',act:defaultChoices});
  setChoices(list);
}
function cultBreathe(){
  if(S.EN<10){ log('体力不足以支撑打坐，先进食或休息。','bad'); return defaultChoices(); }
  const g=GONGS[S.mainGong];
  const ling=(g&&g.attr==='灵')?(1+0.05*gongLv(S.mainGong)):1;
  const gain=(1.5 + S.wu/40 + (S.rootq==='天灵根'?1:0)) * rnd(3,6) * ling;
  S.prog=clamp(S.prog+gain,0,100);
  S.EN-=8; S.MP=clamp(S.MP+Math.round(S.maxMP*0.05*(g&&g.attr==='灵'?1.5:1)),0,S.maxMP);
  advanceTime(rnd(15,45));   // 修炼闭关数日
  log('你运转主修功法【'+(S.mainGong||'无')+'】盘膝参修，闭关数日，灵气如涓涓细流汇入丹田。修为进度 +'+gain.toFixed(1)+'%（当前 '+Math.round(S.prog)+'%）。','good');
  if(S.prog>=100 && S.ri<8) log('🌟 修为已圆满，可尝试【突破】境界！','ev');
  renderAll();
  if(S.prog>=100 && S.ri<8) tryBreakPrompt(); else defaultChoices();
}
function cultComprehend(){
  if(S.EN<10){ log('心力不足，难以参悟，且去休养。','bad'); return defaultChoices(); }
  const g=S.mainGong, lv=gongLv(g);
  if(lv>=3){ log('【'+g+'】已至凡境巅峰（Lv3），再进需更高深传承。','sys'); return doCultivate(); }
  advanceTime(rnd(20,60)); S.EN-=10;
  S.gongLv[g]=lv+1;
  const gdef=GONGS[g]; let extra='';
  if(gdef&&gdef.attr==='血'){ recalcMax(); S.HP=clamp(S.HP+S.maxHP*0.1,0,S.maxHP); extra='气血上限更盛。'; }
  log('🧘 你于静室中潜心思悟【'+g+'】，一朝顿彻，功法境界升至 <b>Lv'+(lv+1)+'</b>！'+extra,'good');
  renderAll(); defaultChoices();
}
function cultSwitch(){
  if(!S.wp||S.wp.length<=1){ log('你仅通一门功法，无从更换。','sys'); return doCultivate(); }
  const list=S.wp.map(g=>{
    const a=GONGS[g]?GONGS[g].attr:'?';
    const atxt=a==='攻'?'攻伐':a==='防'?'守御':a==='灵'?'灵润':a==='血'?'炼体':'';
    return {t:'改修【'+g+'】'+(GONGS[g]?('（'+atxt+'·Lv'+gongLv(g)+'）'):''),act:()=>{ S.mainGong=g; log('你转修【'+g+'】为主修功法。','good'); doCultivate(); }};
  });
  list.push({t:'返回',act:doCultivate});
  setChoices(list);
}

function tryBreakPrompt(){
  setChoices([
    {t:'凝聚道基，尝试突破！',act:tryBreak},
    {t:'再沉淀一二，暂不突破',act:defaultChoices},
  ]);
}

function tryBreak(){
  if(S.ri>=8){
    let frate = 0.03 + (S.gen/10)*0.02 + (S.fu/10)*0.01 + (LOCATIONS[S.loc].tier>=4?0.05:0);
    ['渡厄丹','凝神丹'].forEach(n=>{ if(S.bag[n]>0){ frate+=0.15; S.bag[n]--; log('动用【'+n+'】，渡劫率 +15%。','good'); } });
    frate=clamp(frate,0.02,0.95);
    const feb=rnd(3,9);   // 渡劫闭关年数
    if(passYears(feb)) return;
    if(Math.random()<frate){
      if(S.ach){ S.ach.realmMax=8; }
      log('🌟🌟 九重天雷加身，你道体无瑕，破碎虚空，飞升上界！三界自此传颂你的名号。','good');
      endLife('飞升上界');
    } else {
      S.HP=clamp(S.HP-S.maxHP*0.6,1,S.maxHP);
      S.status.push({t:'天劫反噬',turns:5});
      log('⚡ 天劫无情，你虽未殒，却重伤濒死，道途受挫。','bad');
      renderAll(); defaultChoices();
    }
    return;
  }
  if(S.prog<100){ log('修为未满，不可强突破，以免根基崩散。','bad'); return defaultChoices(); }
  const next=REALMS[S.ri+1];
  let rate=next.rate;
  // 加成
  const breakItems=['筑基丹','凝神丹'];
  breakItems.forEach(n=>{ if(S.bag[n]>0){ rate+=ITEMS[n].val; S.bag[n]--; log('动用【'+n+'】，突破率 +'+(ITEMS[n].val*100)+'%。','good'); } });
  rate += (S.gen/10)*0.02 + (S.fu/10)*0.01;
  if(LOCATIONS[S.loc].tier>=4) rate+=0.05; // 灵地
  rate=clamp(rate,0.02,0.95);
  const roll=Math.random();
  advanceTime(rnd(3,8));
  if(roll<rate){
    const cl=rnd(2,5)+S.ri*S.ri;   // 闭关年数随目标境界递增（练气数年，渡劫上百载）
    log('你觅地闭关，潜心参悟大道……（闭关 '+cl+' 年）','sys');
    if(passYears(cl)) return;
    S.ri++; S.si=0; S.prog=0;
    const oldHP=S.maxHP, oldMP=S.maxMP, oldSH=S.maxShen;
    recalcMax();
    const dh=S.maxHP-oldHP, dm=S.maxMP-oldMP, ds=S.maxShen-oldSH;
    S.HP=clamp(S.HP+dh,0,S.maxHP); S.MP=clamp(S.MP+dm,0,S.maxMP); S.SH=clamp(S.SH+ds,0,S.maxShen);
    log('⚡ 轰！天地震动，你冲破桎梏，成功晋升【'+next.name+SUBNAME[0]+'】！（闭关 '+cl+' 年，各项上限大幅提升）','good');
    if(S.ach){ S.ach.breaks++; S.ach.realmMax=Math.max(S.ach.realmMax,S.ri); }
    if(S.ri===8) log('🌟 你已至渡劫期，九重天雷在即。渡劫成功便可飞升——三界将铭记你的名号。','ev');
  } else {
    const hard=Math.random()<0.5;
    if(hard){
      S.prog=clamp(S.prog-rnd(10,30),0,100);
      S.HP=clamp(S.HP-S.maxHP*0.5,1,S.maxHP);
      S.status.push({t:'走火入魔',turns:4});
      log('💥 突破失败！灵力逆乱，走火入魔，生命 -50%，修为倒退。','bad');
    } else {
      S.prog=clamp(S.prog-rnd(10,30),0,100);
      log('突破失败，灵气溃散，修为倒退些许，所幸根基无碍。','bad');
    }
  }
  settleOrders();   // 突破亦历岁月，结算到期寄售/委托
  renderAll(); defaultChoices();
}

function travelTo(id){
  if(S.age<ADULT_AGE){ log('你尚年幼，双亲不允你独自远行。（及冠之后即可行走三界）','sys'); return defaultChoices(); }
  if(!LOCATIONS[S.loc].neighbors.includes(id)){ log('此地从当前位置无法直接抵达。','sys'); return; }
  S.loc=id; S.EN-=rnd(4,10); advanceTime(rnd(2,4));
  renderAll(); event_arrive();
}

function explore(){
  if(S.age<ADULT_AGE) return childExplore();
  if(S.EN<5){ log('体力不支，无法远行探索。','bad'); return defaultChoices(); }
  S.EN-=rnd(4,8); advanceTime(rnd(1,4));
  const r=Math.random();
  if(r<0.45){ startCombat(); }
  else if(r<0.7){ smallFortune(); }
  else { log('你踏勘此地，山水无恙，唯闻风过林梢。'+(S.EN<20?'（体力渐乏）':''),'sys'); renderAll(); defaultChoices(); }
}

function gather(){
  if(S.age<ADULT_AGE){ log('你年幼力弱，采药这般辛苦事还做不来，且去玩耍罢。','sys'); return defaultChoices(); }
  const L=LOCATIONS[S.loc];
  if(!L.herbs || !L.herbs.length){ log('此地灵气稀薄，寻不得什么灵草。','sys'); return defaultChoices(); }
  if(S.EN<6){ log('体力不足，采药需气力。','bad'); return defaultChoices(); }
  S.EN-=6; advanceTime(rnd(1,3));
  // 按地点 tier 决定可采品阶概率
  const name=pick(L.herbs);
  S.bag[name]=(S.bag[name]||0)+1;
  if(S.ach) S.ach.herbs++;
  const pin=HERBS[name].pin;
  log('你在山野间采得【'+name+'】（'+pin+'品灵草）！可售于坊市或留待炼丹。','good');
  // 采药时偶遇妖兽
  if(Math.random()<0.3){ log('采药间忽觉腥风扑面——有妖兽循味而来！','ev'); startCombat(); return; }
  renderAll(); defaultChoices();
}

function rest(){
  S.EN=clamp(S.EN+40,0,100); S.HP=clamp(S.HP+Math.round(S.maxHP*0.2),0,S.maxHP);
  S.MP=clamp(S.MP+Math.round(S.maxMP*0.2),0,S.maxMP);
  advanceTime(rnd(4,8));
  log('你寻一处静地调息安睡，体力恢复，伤势稍愈。','good');
  if(S.age<ADULT_AGE) ageUp(1);   // 幼年：睡一觉也长一岁
  renderAll(); defaultChoices();
}

/* ===================== 赛事（V1.4） ===================== */
// 比武大会：递进擂台，连胜越多赏越厚，魁首可遇佳人/悟法
function tournament(){
  if(S.EN<5){ log('倦怠，无力登台。','sys'); return defaultChoices(); }
  S.EN-=5; advanceTime(rnd(2,6));
  const rounds=rnd(3,5); let win=0;
  for(let i=1;i<=rounds;i++){
    const eri=clamp(S.ri+rnd(-1,2),0,8);
    const pw=S.ri*40+60+S.gen*0.3, ew=eri*40+60;
    const p=clamp(0.5+(pw-ew)/200+(S.wu-50)/200,0.15,0.95);
    if(Math.random()<p) win++; else break;
  }
  if(win>=rounds){

function huntResolve(b){

}

/* ===================== 战斗 ===================== */
let COMBAT=null;
function startCombat(){
  if(S.age<ADULT_AGE){ log('你尚年幼，遇事自有长辈护持，未曾卷入争斗。','sys'); return defaultChoices(); }
  const L=LOCATIONS[S.loc];
  const type = (L.type==='mo')?'mo':(L.type==='yao')?'yao':(L.type==='danger')?'danger':(L.type==='neutral')?'neutral':'human';
  const name=pick(ENEMY_NAMES[type]);
  // 敌人境界：随地点 tier
  let eri = clamp(S.ri + rnd(-1,1) + Math.floor((L.tier-2)/1.5), 0, 8);
  const eprof = (type==='mo')?'魔修':(type==='yao')?'妖修':pick(['剑修','法修','体修','符修']);
  const est=REALMS[eri];
  const tierScale = 1 + (L.tier-2)*0.06;   // 凶地强者更盛
  const ehp=Math.round(est.hp*SUB[rnd(0,3)]*(0.8+Math.random()*0.5)*tierScale);
  COMBAT={ name, ri:eri, prof:eprof, HP:ehp, maxHP:ehp,
    defPow:(eri*20+30)*PROFS[eprof].def*(0.8+Math.random()*0.4)*tierScale,
    atkPow:(eri*40+50)*PROFS[eprof].atk*(0.8+Math.random()*0.4)*tierScale,
    turn:0, defend:false, eDefend:false, eCharge:false, charge:false, youDefBuff:1 };
  log('⚔ 遭遇【'+name+'】（'+REALMS[eri].name+'·'+eprof+'）！一场恶战在所难免。','ev');
  combatChoices();
}
function combatChoices(){
  if(!COMBAT) return;
  log('⚔ 敌方【'+COMBAT.name+'】气血 '+Math.max(0,Math.round(COMBAT.HP))+'/'+COMBAT.maxHP+(COMBAT.eCharge?'（蓄力中）':'')+(COMBAT.youDefBuff<1?'（你已布防）':''),'sys');
  const g=GONGS[S.mainGong];
  setChoices([
    {t:'御敌强攻（普通攻击）',act:()=>combatAction('attack')},
    {t:'施展绝技「'+(g?g.skill.name:'御剑斩')+'」',act:()=>combatAction('skill')},
    {t:'凝神防御',act:()=>combatAction('defend')},
    {t: COMBAT.charge?'（已蓄力）取消蓄力':'蓄力一击（下回合攻击×1.6）', act:()=>combatAction('charge')},
    {t:'运物助战（丹药/符箓）',act:combatItemMenu},
    {t:'遁走脱战',act:()=>combatAction('flee')},
  ]);
}
function combatAction(act){
  if(!COMBAT) return;
  COMBAT.turn++;
  const g=GONGS[S.mainGong];
  let pAtk=(S.ri*40+60+SUB[S.si]*15)*PROFS[S.prof].atk;
  let pDef=(S.ri*20+20)*PROFS[S.prof].def;
  if(g){ const lv=gongLv(S.mainGong);
    if(g.attr==='攻') pAtk*=(1+0.06*lv);
    else if(g.attr==='防') pDef*=(1+0.06*lv);
    else if(g.attr==='血'){ pAtk*=(1+0.025*lv); pDef*=(1+0.05*lv); }
  }
  if(S.weapon) pAtk+=weaponAtk(S.weapon);
  if(S.armor) pDef+=armorDef(S.armor);
  const youDefMult = COMBAT.youDefBuff||1;

  // 玩家行动
  if(act==='flee'){
    const sk=S.bag['遁地符']>0;
    if(sk){ S.bag['遁地符']--; log('你捏碎【遁地符】，金光一闪，瞬息脱身。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    const chance=0.3 + (S.ri-COMBAT.ri)*0.1 + (g&&g.attr==='灵'?0.05:0);
    if(Math.random()<chance){ log('你身法如电，撤出战圈，全身而退。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    log('逃跑失败！破绽大露。','bad');
  } else if(act==='defend'){
    COMBAT.defend=true; log('你凝神聚气，守势如铁壁。','sys');
  } else if(act==='charge'){
    COMBAT.charge=!COMBAT.charge;
    log(COMBAT.charge?'你沉腰坐马，灵力汇聚于兵刃，蓄势待发（下回合攻击×1.6）。':'你散去蓄力，回归常态。','sys');
  } else {
    COMBAT.defend=false;
    let mult=1, mp=0;
    if(act==='skill'){ const sk=g?g.skill:PROFS[S.prof].skill; mult=sk.mult; mp=sk.mp;
      if(S.MP<mp){ log('灵力不足，绝技难以施展，只得强行为之！','bad'); S.HP=clamp(S.HP-S.maxHP*0.05,1,S.maxHP); }
      else S.MP-=mp;
    }
    if(COMBAT.charge){ mult*=1.6; COMBAT.charge=false; log('✦ 蓄力一击！','good'); }
    let dmg=Math.round(pAtk*mult - COMBAT.defPow*0.6);
    if(KEKE[S.prof]===COMBAT.prof) dmg=Math.round(dmg*1.25);   // 职业克制
    if(S.fu>=65 && Math.random()<S.fu/260){ dmg=Math.round(dmg*1.8); log('✦ 福缘暴击！','good'); }  // 暴击
    if(S.gen>=80 && Math.random()<0.06){ dmg=Math.round(dmg*1.15); log('✦ 身法如鬼，破绽尽显！','good'); }  // 身法破绽
    dmg=Math.max(1,dmg);
    COMBAT.HP-=dmg;
    log('你'+(act==='skill'?'施展【'+(g?g.skill.name:'御剑斩')+'】':'挥击')+'，重创'+COMBAT.name+'，造成 '+dmg+' 点伤害。','good');
    if(S.bag['火符']>0 && Math.random()<0.25){ S.bag['火符']--; COMBAT.HP-=200; log('顺势甩出【火符】，再添 200 伤！','good'); }
  }
  if(COMBAT && COMBAT.HP<=0){ return winCombat(); }

  // 敌方行动（AI：攻 / 防 / 蓄力）
  if(COMBAT){
    if(COMBAT.eDefend) COMBAT.eDefend=false;
    const eact=Math.random(); let em=1;
    if(eact<0.18){ COMBAT.eDefend=true; log(COMBAT.name+'凝势防守。','sys'); }
    else if(eact<0.30){ COMBAT.eCharge=!COMBAT.eCharge; log(COMBAT.name+(COMBAT.eCharge?'周身煞气翻涌，似在蓄力……':'收束煞气。'),'sys'); }
    else {
      if(COMBAT.eCharge){ em=1.5; COMBAT.eCharge=false; log(COMBAT.name+'蓄力爆发！','bad'); }
      let edmg=Math.round(COMBAT.atkPow*em - pDef*0.6*youDefMult);
      if(KEKE[COMBAT.prof]===S.prof) edmg=Math.round(edmg*1.25);
      if(COMBAT.defend) edmg=Math.round(edmg*0.4);
      edmg=Math.max(1,edmg);
      S.HP-=edmg;
      log(COMBAT.name+'反扑，你受 '+edmg+' 点伤害。'+(S.HP< S.maxHP*0.3?'（气血危急！）':''),'bad');
    }
    COMBAT.defend=false;
  }
  advanceTime(1); renderAll();
  if(S.HP<=0) return dead();
  combatChoices();
}
function combatItemMenu(){
  if(!COMBAT) return;
  const usable=Object.keys(S.bag).filter(k=>S.bag[k]>0 && ITEMS[k] && (ITEMS[k].cat==='丹药'||ITEMS[k].cat==='符箓'));
  if(!usable.length){ log('行囊中无可用丹药符箓。','sys'); return combatChoices(); }
  const list=usable.map(k=>{ const it=ITEMS[k];
    const lbl = it.cat==='丹药' ? (it.type==='hp'?'疗伤':it.type==='mp'?'回灵':it.type==='full'?'回元':it.type==='cure'?'解厄':it.type==='break'?'突破':'')
                                : (it.type==='atk'?'伤敌':it.type==='def'?'护体':it.type==='flee'?'脱战':'');
    return {t:'用【'+k+'】('+lbl+')', act:()=>combatUseItem(k)};
  });
  list.push({t:'返回战斗', act:combatChoices});
  setChoices(list);
}
function combatUseItem(key){
  if(!COMBAT) return;
  if(!S.bag[key]||S.bag[key]<=0){ log('该物已用完。','sys'); return combatChoices(); }
  const it=ITEMS[key];
  if(it.cat==='丹药'){
    if(it.type==='hp') S.HP=clamp(S.HP+it.val,0,S.maxHP);
    else if(it.type==='mp') S.MP=clamp(S.MP+it.val,0,S.maxMP);
    else if(it.type==='full'){ S.HP=clamp(S.HP+S.maxHP*it.val,0,S.maxHP); S.MP=clamp(S.MP+S.maxMP*it.val,0,S.maxMP); }
    else if(it.type==='cure') S.status=S.status.filter(s=>s.t!==it.val);
    else if(it.type==='break'){ log('【'+key+'】须在突破时使用。','sys'); return combatChoices(); }
    S.bag[key]--; log('你服下【'+key+'】，'+it.desc+'。','good');
  } else if(it.cat==='符箓'){
    if(it.type==='flee'){ S.bag[key]--; log('你捏碎【'+key+'】，金光一闪，瞬息脱身。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    if(it.type==='def'){ if(!COMBAT.youDefBuff) COMBAT.youDefBuff=1; COMBAT.youDefBuff*=it.val; S.bag[key]--; log('你祭出【'+key+'】，本场减伤！','good'); }
    if(it.type==='atk'){ S.bag[key]--; COMBAT.HP-=it.val; log('甩出【'+key+'】，伤敌 '+it.val+'！','good'); if(COMBAT.HP<=0){ renderAll(); return winCombat(); } }
  }
  // 用物后敌方行动
  if(COMBAT){
    if(COMBAT.eDefend) COMBAT.eDefend=false;
    const eact=Math.random(); let em=1;
    if(eact<0.18){ COMBAT.eDefend=true; log(COMBAT.name+'趁你调息，凝势防守。','sys'); }
    else {
      if(COMBAT.eCharge){ em=1.5; COMBAT.eCharge=false; log(COMBAT.name+'蓄力爆发！','bad'); }
      let edmg=Math.round(COMBAT.atkPow*em - ((S.ri*20+20)*PROFS[S.prof].def+(S.armor?armorDef(S.armor):0))*0.6*(COMBAT.youDefBuff||1));
      if(KEKE[COMBAT.prof]===S.prof) edmg=Math.round(edmg*1.25);
      edmg=Math.max(1,edmg);
      S.HP-=edmg; log(COMBAT.name+'趁机反扑，你受 '+edmg+' 伤。'+(S.HP<S.maxHP*0.3?'（气血危急！）':''),'bad');
    }
    COMBAT.defend=false;
  }
  advanceTime(1); renderAll();
  if(S.HP<=0) return dead();
  combatChoices();
}
function winCombat(){
  const exp = (COMBAT.ri+1)*rnd(8,16);
  S.prog=clamp(S.prog+exp/3,0,100);
  const drop = COMBAT.ri>=2 ? rnd(5,20) : rnd(1,6);
  S.spirit.下+=drop;
  let txt='⚔ 你斩杀【'+COMBAT.name+'】，修为精进，得下品灵石 '+drop+' 枚。';
  if(Math.random()<0.3){ const g=rnd(2,15); S.gold+=g; txt+=' 另获金银 '+g+' 两。'; }
  log(txt,'good');
  if(S.ach){ S.ach.slain++; S.ach.realmMax=Math.max(S.ach.realmMax,S.ri); }
  COMBAT=null; advanceTime(rnd(1,2)); renderAll();
  if(S.prog>=100 && S.ri<8) tryBreakPrompt(); else defaultChoices();
}
function dead(){
  log('💀 你气血耗尽，倒在血泊之中……','bad');
  endLife('陨落');
}

function endLife(reason){
  const e = saveRecall(reason);
  log('📜 一世终结，已存入「回忆录」。','good');
  if(e.heir) log('❖ 你留有后裔【'+e.heirName+'】，可在开局时选择「继承」，延续血脉。','ev');
  COMBAT=null;
  setChoices([{t:'翻阅回忆录',act:openRecall},{t:'重开此世',act:()=>location.reload()}]);
}

function saveRecall(reason){
  const recall = loadRecall();
  let highlights=[];
  try{
    const lines = (logEl && logEl.querySelectorAll) ? logEl.querySelectorAll('.line') : [];
    for(let i=lines.length-1; i>=0 && highlights.length<8; i--){
      const t=lines[i].textContent, c=(lines[i].className||'');
      if(c.indexOf('good')>=0 || c.indexOf('ev')>=0) highlights.unshift('· '+t);
    }
  }catch(_){}
  const rm = (S.ach?S.ach.realmMax:0);
  const e={
    id: recall.length,
    name:S.name, sex:S.sex, age:S.age, origin:S.origin, root:S.root, rootq:S.rootq, prof:S.prof,
    realmMax: rm, realmName: REALMS[rm].name+SUBNAME[0],
    ach: S.ach?JSON.parse(JSON.stringify(S.ach)):{},
    end: reason, heir: (S.后代&&S.后代.length>0),
    heirName: (S.后代&&S.后代.length>0)?S.后代[S.后代.length-1].name:null,
    heirs: (S.后代||[]).map(c=>({name:c.name, sex:c.sex||'男', root:c.root||S.root, rootq:c.rootq||S.rootq})),
    inherit: { spirit:Math.floor(S.spirit.下/2), weapon:S.weapon, armor:S.armor, wp:(S.wp||[]).slice(), gold:Math.floor(S.gold/2) },
    highlights, time: S.year+'年'
  };
  recall.push(e);
  try{ localStorage.setItem(RECALL_KEY, JSON.stringify(recall)); }catch(_){}
  return e;
}

function weaponAtk(n){ return ITEMS[n]?ITEMS[n].atk:30; }
function armorDef(n){ return ITEMS[n]?ITEMS[n].def:20; }

/* ===================== 物品使用 ===================== */
function useItemByName(name){
  // 在背包里模糊匹配
  let key=null;
  for(const k in S.bag){ if(S.bag[k]>0 && (k.includes(name)||name.includes(k))){ key=k; break; } }
  if(!key){ log('行囊中并无此物。','sys'); return; }
  useItem(key);
}
function useItem(key){
  if(!S.bag[key]||S.bag[key]<=0){ log('该物已用完。','sys'); return; }
  const it=ITEMS[key];
  if(!it){ // 灵草类：直接卖或留，提示
    log('【'+key+'】为灵草材料，可于坊市售出，或留待炼丹（炼丹系统后续开放）。','sys'); return;
  }
  if(it.cat==='丹药'){
    if(it.type==='hp'){ S.HP=clamp(S.HP+it.val,0,S.maxHP); }
    else if(it.type==='mp'){ S.MP=clamp(S.MP+it.val,0,S.maxMP); }
    else if(it.type==='full'){ S.HP=clamp(S.HP+S.maxHP*it.val,0,S.maxHP); S.MP=clamp(S.MP+S.maxMP*it.val,0,S.maxMP); }
    else if(it.type==='cure'){ S.status=S.status.filter(s=>s.t!==it.val); }
    else if(it.type==='break'){ log('【'+key+'】须在突破时使用，当前已收入囊中。','sys'); return; }
    S.bag[key]--; log('你服下【'+key+'】，'+it.desc+'。','good');
  } else if(it.cat==='符箓'){
    if(it.type==='flee'){ log('【'+key+'】须在战斗中使用。','sys'); return; }
    if(it.type==='def'){ if(COMBAT){ COMBAT.youDefBuff=(COMBAT.youDefBuff||1)*it.val; } log('【'+key+'】须在战斗中使用。','sys'); return; }
    if(it.type==='atk'){ if(COMBAT){ COMBAT.HP-=it.val; S.bag[key]--; log('甩出【'+key+'】，伤敌 '+it.val+'！','good'); if(COMBAT.HP<=0) return winCombat(); } else log('【'+key+'】须在战斗中使用。','sys'); return; }
  }
  advanceTime(1); renderAll(); defaultChoices();
}

let SHOP_TAB='trade';
function openShop(){
  marketRefresh();
  SHOP_TAB = LOCATIONS[S.loc].shop ? 'trade' : 'black';
  renderShop();
  log('你步入坊市，奇珍异宝、灵草法器琳琅满目。','sys');
}
function setShopTab(t){ SHOP_TAB=t; renderShop(); }
function renderShop(){
  const L=LOCATIONS[S.loc];
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">🏪 '+L.name+'·坊市</h2>';
  h+='<p class="small">行情：'+MARKET.trend+'（买卖价 ×'+MARKET.mult+'）　灵石：下'+S.spirit.下+' 中'+S.spirit.中+'　金银 '+S.gold+' 两</p>';
  const tabs=[['trade','买卖'],['refine','丹房'],['auction','拍卖寄售'],['barter','以物易物'],['commission','委托收购'],['black','黑市']];

}
function shopTrade(){
  let h='<div class="mtip">—— 收购（你卖，价随行情） ——</div>';
  const sellList=Object.keys(S.bag).filter(k=>S.bag[k]>0 && HERBS[k]);
  if(sellList.length) sellList.forEach(k=>{ const price=Math.round(HERBS[k].price*MARKET.mult);
    h+='<div class="shopitem"><span>'+k+'（'+HERBS[k].pin+'品）×'+S.bag[k]+'　售价 '+price+'</span><button class="btn sm" onclick="sellHerb(\''+k+'\')">卖1</button></div>'; });
  else h+='<div class="small">（无灵草可卖）</div>';
  h+='<div class="mtip">—— 出售（你买） ——</div>';
  if(LOCATIONS[S.loc].shop){ for(const k in ITEMS){ const it=ITEMS[k]; const p=Math.round(it.price*MARKET.mult);
    h+='<div class="shopitem"><span>'+k+'　'+p+' 下灵石　<span class="small">'+it.desc+'</span></span><button class="btn sm" onclick="buyItem(\''+k+'\')">买</button></div>'; } }
  else h+='<div class="small">（此处无正规商铺，唯黑市可交易）</div>';
  return h;
}
function shopRefine(){ return refineHTML(); }
function shopAuction(){
  let h='<div class="mtip">—— 寄售（闭关数年后高价售出，1.3~2.2倍） ——</div>';
  const items=Object.keys(S.bag).filter(k=>S.bag[k]>0);
  if(items.length) items.forEach(k=>{ const base=HERBS[k]?HERBS[k].price:(ITEMS[k]?ITEMS[k].price:5);
    h+='<div class="shopitem"><span>'+k+'×'+S.bag[k]+'（约 '+Math.round(base*1.5)+'+ 下灵石）</span><button class="btn sm" onclick="consignItem(\''+k+'\')">寄售1</button></div>'; });
  else h+='<div class="small">（行囊空空）</div>';
  h+='<div class="mtip">—— 寄售中 ——</div>';
  let n=0; if(S.orders) S.orders.forEach(o=>{ if(o.type==='sell'){ h+='<div class="small">'+o.name+'　约 '+o.year+' 年售出</div>'; n++; } });
  if(!n) h+='<div class="small">（暂无）</div>';
  return h;
}
function shopBarter(){
  let h='<div class="small">以物易物：交出一物，换得随机天材地宝或法器（盈亏看运气）。</div>';
  const items=Object.keys(S.bag).filter(k=>S.bag[k]>0);
  if(items.length) items.forEach(k=>{ h+='<div class="shopitem"><span>'+k+'×'+S.bag[k]+'</span><button class="btn sm" onclick="barterItem(\''+k+'\')">易物</button></div>'; });
  else h+='<div class="small">（行囊空空）</div>';
  return h;
}
function shopCommission(){
  let h='<div class="small">委托商队代寻灵草，付定金，数日后到货（价随行情）。</div>';
  for(const n in HERBS){ const price=Math.round(HERBS[n].price*1.4)+5;
    h+='<div class="shopitem"><span>'+n+'（'+HERBS[n].pin+'品）定金 '+price+'</span><button class="btn sm" onclick="commissionHerb(\''+n+'\')">委托</button></div>'; }
  h+='<div class="mtip">—— 委托中 ——</div>';
  let n=0; if(S.orders) S.orders.forEach(o=>{ if(o.type==='buy'){ h+='<div class="small">'+o.name+'　约 '+o.year+' 年到货</div>'; n++; } });
  if(!n) h+='<div class="small">（暂无）</div>';
  return h;
}
function shopBlack(){
  let h='<div class="small">黑市交易，凶险亦有机缘：掷灵石赌石，或购禁物。</div>';
  [20,50,100].forEach(c=>{ h+='<div class="shopitem"><span>赌石（耗 '+c+' 下品灵石）</span><button class="btn sm" onclick="gambleStone('+c+')">下注</button></div>'; });
  h+='<div class="mtip">—— 禁物（高风险） ——</div>';
  [['魔晶石',120],['噬魂丹',90],['血煞符',60]].forEach(it=>{ h+='<div class="shopitem"><span>'+it[0]+'（禁物）</span><button class="btn sm" onclick="buyForbidden(\''+it[0]+'\','+it[1]+')">购</button></div>'; });
  return h;
}
function consignItem(k){
  if((S.bag[k]||0)<=0) return;
  const base=HERBS[k]?HERBS[k].price:(ITEMS[k]?ITEMS[k].price:5);
  S.bag[k]--; S.orders.push({type:'sell',name:k,year:S.year+rnd(1,4),base});
  log('你将【'+k+'】交付商队寄售，约定数年后售出。','good'); renderShop();
}
function barterItem(k){
  if((S.bag[k]||0)<=0) return;
  S.bag[k]--; const pool=Object.keys(ITEMS).concat(Object.keys(HERBS)); const g=pick(pool);
  S.bag[g]=(S.bag[g]||0)+1; log('你以【'+k+'】易得【'+g+'】。','good'); renderShop();
}
function commissionHerb(n){
  const price=Math.round(HERBS[n].price*1.4)+5;
  if(S.spirit.下<price){ log('下品灵石不足，付不起定金。','bad'); return renderShop(); }
  S.spirit.下-=price; S.orders.push({type:'buy',name:n,year:S.year+rnd(1,4),base:HERBS[n].price});
  log('你委托商队代寻【'+n+'】。','good'); renderShop();
}
function gambleStone(cost){
  if(S.spirit.下<cost){ log('灵石不足，赌不起。','bad'); return renderShop(); }
  S.spirit.下-=cost; advanceTime(rnd(1,5)); const r=Math.random();
  if(r<0.3){ const g=pick(Object.keys(HERBS).filter(x=>HERBS[x].pin>=5)); S.bag[g]=(S.bag[g]||0)+1; log('💎 石皮崩裂，露出【'+g+'】一枚！大赚。','good'); }
  else if(r<0.5){ const back=Math.round(cost*(1.2+Math.random())); S.spirit.下+=back; log('赌石小赚，回灵石 '+back+'。','good'); }
  else if(r<0.65){ log('💀 切开是废石，血本无归。','bad'); }
  else { const back=Math.round(cost*0.5); S.spirit.下+=back; log('切开凡石，仅回本 '+back+'。','sys'); }
  renderShop();
}
function buyForbidden(name,price){
  if(S.spirit.下<price){ log('下品灵石不足。','bad'); return renderShop(); }
  S.spirit.下-=price; S.bag[name]=(S.bag[name]||0)+1; log('你于暗处购入禁物【'+name+'】，行事须谨慎。','sys'); renderShop();
}
function settleOrders(){
  if(!S.orders||!S.orders.length) return;
  const left=[];
  S.orders.forEach(o=>{
    if(S.year>=o.year){
      if(o.type==='sell'){ const gain=Math.round(o.base*(1.3+Math.random()*0.9)); S.spirit.下+=gain; log('📦 寄售的【'+o.name+'】售出，得下品灵石 '+gain+'。','good'); }
      else { S.bag[o.name]=(S.bag[o.name]||0)+1; log('📦 委托的【'+o.name+'】已送到，入你行囊。','good'); }
    } else left.push(o);
  });
  S.orders=left;
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  if(COMBAT) combatChoices();   // 战斗中关弹窗，须交还战斗选项，不可劫持
  else defaultChoices();
}
function buyItem(k){
  const it=ITEMS[k]; const p=Math.round(it.price*MARKET.mult);
  if(S.spirit.下<p){ log('下品灵石不足，买不起【'+k+'】。','bad'); return; }
  S.spirit.下-=p;
  if(it.cat==='丹药'||it.cat==='符箓') S.bag[k]=(S.bag[k]||0)+1;
  else if(it.slot==='武器'){ if(S.weapon && ITEMS[S.weapon]) S.spirit.下+=Math.round(ITEMS[S.weapon].price*0.4); S.weapon=k; }
  else if(it.slot==='防具'){ if(S.armor && ITEMS[S.armor]) S.spirit.下+=Math.round(ITEMS[S.armor].price*0.4); S.armor=k; }
  else if(it.slot==='饰品'){ S.ring=k; }
  log('购入【'+k+'】。','good'); renderShop(); renderAll();
}
function sellHerb(k){
  const price=Math.round(HERBS[k].price*MARKET.mult); if(!S.bag[k]||S.bag[k]<=0) return;
  S.bag[k]--; S.spirit.下+=price; log('售出【'+k+'】，得下品灵石 '+price+' 枚。','good');
  renderShop(); renderAll();
}

/* ===================== 炼丹 ===================== */
function refineHTML(){
  const isAlch = (S.prof==='丹修'||S.prof==='药修');
  let h='<p class="small">主修：'+S.prof+'。'+(isAlch?'丹/药之道有成，炼丹十拿九稳，且省一成灵石。':'非丹道出身，火候难控，约八成二成丹，失则灵草尽毁。')+'</p>';
  let any=false;
  for(const k in PILL_RECIPES){
    const r=PILL_RECIPES[k];
    const hasHerbs = Object.keys(r.need).every(hn=> (S.bag[hn]||0) >= r.need[hn]);
    const need = Object.keys(r.need).map(hn=>hn+'×'+r.need[hn]).join('、');
    const cost = isAlch ? Math.max(1,Math.round(r.spirit*0.9)) : r.spirit;
    const ok = hasHerbs && S.spirit.下>=cost;
    h+='<div class="shopitem"><span>'+k+'（'+r.desc+'）<br><span class="small">所需：'+need+' + 下品灵石'+cost+'</span></span>'+
       (ok ? '<button class="btn sm" onclick="refinePill(\''+k+'\')">炼制</button>' : '<span class="small">'+(hasHerbs?'灵石不足':'灵草不足')+'</span>')+'</div>';
    if(ok) any=true;
  }
  if(!any) h+='<p class="small">（材料或灵石不足，先去采药或坊市筹措。）</p>';
  return h;
}
function openRefine(){ marketRefresh(); SHOP_TAB='refine'; log('你于丹炉前审视手中灵草。','sys'); renderShop(); }
function refinePill(k){
  const r=PILL_RECIPES[k];
  for(const hn in r.need){ if((S.bag[hn]||0) < r.need[hn]){ log('灵草【'+hn+'】不足，无从炼制。','bad'); return renderShop(); } }
  const isAlch=(S.prof==='丹修'||S.prof==='药修');
  const cost = isAlch ? Math.max(1,Math.round(r.spirit*0.9)) : r.spirit;
  if(S.spirit.下 < cost){ log('下品灵石不足，无力生火。','bad'); return renderShop(); }
  for(const hn in r.need){ S.bag[hn]-=r.need[hn]; }
  S.spirit.下 -= cost;
  advanceTime(rnd(5,20));
  if(isAlch || Math.random()<0.82){
    S.bag[k]=(S.bag[k]||0)+1; if(S.ach) S.ach.pills=(S.ach.pills||0)+1;
    log('丹香四溢！你炼成【'+k+'】一枚。'+(isAlch?'（丹道加成，稳如老狗）':''),'good');
  } else {
    log('💥 丹炉骤炸，灵草尽毁'+(isAlch?'':'（非丹道出身，火候难控）')+'。','bad');
  }
  renderAll(); renderShop();
}

function saveGame(silent){
  try{
    localStorage.setItem(SAVE_KEY+CUR_SLOT, JSON.stringify(S));
    if(!silent) log('【存档点】档位'+CUR_SLOT+'进度已记录于天地之间。','good');
  }catch(e){ log('存档失败：'+e.message,'bad'); }
}
function migrateSave(){
  if(!S) return;
  if(!S.wp) S.wp=[];
  if(!S.gongLv) S.gongLv={};
  if(!S.mainGong){
    const mg=(PROFS[S.prof]&&PROFS[S.prof].skill.name)||'引气诀';
    S.mainGong=mg; if(!S.wp.includes(mg)) S.wp.push(mg); if(!S.gongLv[mg]) S.gongLv[mg]=1;
  }
  if(!S.gongLv[S.mainGong]) S.gongLv[S.mainGong]=1;
}
function loadGame(){
  const d=localStorage.getItem(SAVE_KEY+CUR_SLOT);
  if(!d){ log('档位'+CUR_SLOT+'尚无存档。','sys'); return; }
  S=JSON.parse(d); migrateSave(); COMBAT=null;
  log('【读档】档位'+CUR_SLOT+'时光倒流，你回到了上次存档之处。','good');
  renderAll(); defaultChoices();
}

  }
  f.visited=true;
  log('你回到家乡，见'+f.members[0].name+'（父）、'+f.members[1].name+'（母）'+(f.members[2]?('与'+f.members[2].name+'（'+f.members[2].rel+'）'):'')+'。双亲见你归来，喜极而泣。','ev');
  if(S.origin==='世家子弟'||S.origin==='宗门弟子'){ S.spirit.下+=30; log('父亲取出一囊下品灵石（30枚）与你傍身。','good'); }
  else if(S.origin==='凡人平民'){ S.gold+=50; log('母亲塞来五十两纹银，嘱咐你莫饿着。','good'); }
  else { S.bag['疗伤丹']=(S.bag['疗伤丹']||0)+1; log('家人递来一枚疗伤丹，盼你平安。','good'); }
  S.HP=clamp(S.HP+Math.round(S.maxHP*0.2),0,S.maxHP);
  advanceTime(rnd(3,5)); renderAll(); defaultChoices();
}

// 生成一位可结交之人（性别、性情、出身各异）
function genCandidate(){
  const sex = Math.random()<0.86 ? (S.sex==='男'?'女':'男') : (Math.random()<0.5?'男':'女');
  const name = genName(sex, Math.random()<0.6?'hong':'fan');
  return { name, sex, fav:rnd(10,30), rong:rnd(45,95),
    trait:pick(['温婉解语','清冷出尘','狡黠灵动','豪爽疏朗','端方守礼','孤高自许']),
    ident:pick(['散修游侠','宗门弟子','世家子弟','坊市商贾','丹道传人','乐坊名伶']),
    married:false };
}
function social(){
  if(S.age<ADULT_AGE){ log('你尚且年幼，情缘之事无从谈起。（及冠之后自有姻缘）','sys'); return defaultChoices(); }
  if(S.EN<3){ log('倦怠，无心交际。','sys'); return defaultChoices(); }
  S.EN-=3; advanceTime(rnd(1,2));
  if(!S.companion){
    const n=rnd(2,3), cands=[];
    for(let i=0;i<n;i++) cands.push(genCandidate());
    log('城中灯火如昼，你可结交之人有 '+n+' 位：','ev');
    const list=cands.map(c=>({t:'结识【'+c.name+'】（'+c.sex+'·'+c.ident+'·'+c.trait+'·容貌'+c.rong+'）',act:()=>{
      S.companion=c; if(S.ach) S.ach.companion=true;
      log('你与【'+c.name+'】搭话相谈，'+c.trait+'，初识好感 '+c.fav+'。','ev');
      afterSocial();
    }}));
    list.push({t:'今日无心风月，独自散心',act:()=>{log('你自斟自饮，未与谁搭话。','sys');defaultChoices();}});
    setChoices(list); return;
  }
  const c=S.companion;
  if(!c.married){
    log('你与【'+c.name+'】（'+c.sex+'·'+c.trait+'）情谊日笃，好感 '+c.fav+'。','sys');
    setChoices([
      {t:'求结为道侣（需好感≥60）',act:()=>{ if(c.fav>=60){c.married=true;log('🌸 你与【'+c.name+'】结为道侣，山盟海誓，三界为证。','good');defaultChoices();}else{log('时机未到，'+c.name+'尚踌躇（好感'+c.fav+'/60）。','bad');afterSocial();}}},
      {t:'赠以灵石（耗20下灵石，好感+12）',act:()=>{ if(S.spirit.下>=20){S.spirit.下-=20;c.fav+=12;log('你赠灵石二十，'+c.name+'浅笑收纳。','good');}else log('灵石不足，无以相赠。','bad'); afterSocial(); }},
      {t:'相伴游历（好感+8~12）',act:()=>{c.fav+=rnd(8,12);log('你们把酒言欢，情意更浓（好感'+c.fav+'）。','good');afterSocial();}},
      {t:'另寻新欢（好聚好散）',act:()=>{ log('你与【'+c.name+'】好聚好散，各自转身。','sys'); S.companion=null; defaultChoices(); }},
      {t:'暂且作别',act:defaultChoices},
    ]);
  } else {
    log('你与道侣【'+c.name+'】（好感'+c.fav+'）琴瑟和鸣。','sys');
    setChoices([
      {t:'共度良宵，盼结珠胎',act:()=>haveChild()},
      {t:'比翼同游',act:()=>{c.fav=Math.min(99,c.fav+rnd(3,7));log('你们携手同游，神仙眷侣。','good');defaultChoices();}},
      {t:'各自修行',act:defaultChoices},
    ]);
  }
}
function afterSocial(){ defaultChoices(); }

function haveChild(){
  if(!S.companion||!S.companion.married){ log('尚无道侣，何来子嗣。','sys'); return defaultChoices(); }
  advanceTime(rnd(2,6));
  const chance = clamp(0.45 + (S.mei-50)/200 + (S.fu-50)/250, 0.25, 0.85);
  if(Math.random()>chance){ log('此番未能结胎，只道缘分未至（魅力'+S.mei+'·福缘'+S.fu+'）。','sys'); return defaultChoices(); }
  const n = Math.random()<0.15 ? 2 : 1;   // 双胎之喜
  const base = S.后代.length, born=[];
  for(let i=0;i<n;i++){
    const sex=Math.random()<0.5?'男':'女';
    const rootq=pick(['天灵根','双灵根','三灵根','四灵根','五灵根']);
    const child={ name:genName(sex,'fan'), sex, root:pick(ROOTS), rootq,
      gen:(rootq==='天灵根')?rnd(70,95):rnd(40,78),
      wu:(rootq==='天灵根')?rnd(68,90):rnd(38,75) };
    S.后代.push(child); born.push(child);
  }
  S.hasHeir=true; if(S.ach) S.ach.heir=true;
  log((n===2?'🌟🌟 天降双胎！':'🌟 喜讯！')+'你与【'+S.companion.name+'】得'+(n===2?'一双儿女':'一'+(born[0].sex==='男'?'儿':'女'))+'。','good');
  born.forEach(c=>{ log('　·【'+c.name+'】（'+c.sex+'）灵根'+c.root+'（'+c.rootq+'），根骨'+c.gen+'、悟性'+c.wu+'。','good'); });
  const list=born.map((c,i)=>({t:'为【'+c.name+'】赐名',act:()=>openNameChild(base+i)}));
  list.push({t:'名字甚好，不必改了',act:defaultChoices});
  setChoices(list);
}
function openNameChild(idx){
  const box=document.getElementById('modalBox');
  const c=S.后代[idx];
  if(!c) return defaultChoices();
  box.innerHTML='<h2 class="seal">✍ 为孩儿赐名</h2>'+
    '<p class="small">当前名：'+c.name+'（'+c.sex+'·'+c.root+'灵根·'+c.rootq+'）</p>'+
    '<input id="nc_name" placeholder="输入新名（留空则不变）" maxlength="8">'+
    '<div class="center" style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="doNameChild('+idx+')">定名</button>'+
    '<button class="btn ghost" onclick="closeModal()">作罢</button></div>';
  document.getElementById('modal').classList.add('show');
}
function doNameChild(idx){
  const el=document.getElementById('nc_name');
  const v=(el&&el.value||'').trim();
  if(v && S.后代[idx]){ const old=S.后代[idx].name; S.后代[idx].name=v; log('你为孩儿定名【'+v+'】（原'+old+'）。','good'); }
  closeModal();
}

/* ---- 选档 ---- */
function renderSlotHint(){
  const el=document.getElementById('slotHint'); if(el) el.textContent='当前选定：档位'+CUR_SLOT;
  for(let i=1;i<=3;i++){ const b=document.getElementById('slotBtn'+i); if(b) b.className='btn sm'+(i===CUR_SLOT?'':' ghost'); }
}
function pickSlot(i){ CUR_SLOT=i; renderSlotHint(); log('已选定档位 '+i+'。','sys'); }
function openSlots(){
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">🗂 选档 / 客制化</h2><p class="small">选档游玩；占用档可读取、导出、删除或覆盖重开。亦可将存档<b>导出为代码</b>，在另一台设备「导入」，实现随身客制化存档（解决换手机/跨设备不同步问题）。</p>';
  for(let i=1;i<=3;i++){
    const d=localStorage.getItem(SAVE_KEY+i);
    let info='<span class="small">空档</span>';
    if(d){ try{ const s=JSON.parse(d); info='<span class="small">'+s.name+' · '+REALMS[s.ri].name+SUBNAME[s.si]+' · '+s.age+'岁</span>'; }catch(_){} }
    h+='<div class="shopitem"><span>档位 '+i+'：'+info+'</span><span>';
    if(d){
      h+='<button class="btn sm" onclick="loadSlot('+i+')">读取</button> ';
      h+='<button class="btn sm ghost" onclick="exportSlot('+i+')">导出</button> ';
      h+='<button class="btn sm ghost" onclick="confirmDelSlot2('+i+')">删除</button> ';
      h+='<button class="btn sm ghost" onclick="pickSlot('+i+');closeModal()">覆盖重开</button>';
    } else {
      h+='<button class="btn sm ghost" onclick="pickSlot('+i+');closeModal()">选定新局</button> ';
      h+='<button class="btn sm ghost" onclick="importSlot('+i+')">导入</button>';
    }
    h+='</span></div>';
  }
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="closeModal()">关闭</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function exportSlot(i){
  const d=localStorage.getItem(SAVE_KEY+i);
  if(!d){ log('该档为空，无可导出。','sys'); return; }
  const code=btoa(unescape(encodeURIComponent(d)));
  const box=document.getElementById('modalBox');
  box.innerHTML='<h2 class="seal">📤 导出档位 '+i+'</h2>'+
    '<p class="small">复制下方存档码，发给自己或留存；在另一台设备「选档→导入」即可载入（客制化随身存档）。</p>'+
    '<textarea style="width:100%;height:160px;font-family:monospace;font-size:12px" readonly onclick="this.select()">'+code+'</textarea>'+
    '<div class="center" style="margin-top:10px"><button class="btn" onclick="openSlots()">返回</button></div>';
}
function importSlot(i){
  const box=document.getElementById('modalBox');
  box.innerHTML='<h2 class="seal">📥 导入到档位 '+i+'</h2>'+
    '<p class="small">粘贴存档码，将覆盖档位 '+i+' 当前内容（若为空则直接写入）。</p>'+
    '<textarea id="impCode" style="width:100%;height:140px;font-family:monospace;font-size:12px"></textarea>'+
    '<div class="center" style="margin-top:10px"><button class="btn" onclick="doImportSlot('+i+')">确认导入</button><button class="btn ghost" onclick="openSlots()">取消</button></div>';
}
function doImportSlot(i){
  const code=(document.getElementById('impCode').value||'').trim();
  if(!code){ log('未粘贴存档码。','sys'); return; }
  try{
    const json=decodeURIComponent(escape(atob(code)));
    JSON.parse(json);
    localStorage.setItem(SAVE_KEY+i, json);
    log('📥 档位'+i+'已导入存档。选定后读取即可游玩。','good');
    openSlots();
  }catch(_){ log('存档码无效，导入失败。','bad'); }
}
function confirmDelSlot2(i){
  const box=document.getElementById('modalBox');
  box.innerHTML='<h2 class="seal">⚠ 确认删除档位 '+i+'？</h2>'+
    '<p class="small">此举将永久抹去档位'+i+'的存档，<b>不可复原</b>。（建议先「导出」备份）</p>'+
    '<div class="center" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" onclick="doDelSlot2('+i+')">确认删除</button>'+
    '<button class="btn ghost" onclick="openSlots()">我再想想</button></div>';
}
function doDelSlot2(i){
  try{ localStorage.removeItem(SAVE_KEY+i); }catch(_){}
  log('🗑 档位'+i+'已抹去。','sys');
  openSlots();
}
function loadSlot(i){
  const d=localStorage.getItem(SAVE_KEY+i);
  if(!d){ log('该档为空。','sys'); return; }
  CUR_SLOT=i; S=JSON.parse(d); migrateSave(); COMBAT=null; closeModal();
  log('【读档】载入档位 '+i+'，时光倒流。','good'); renderAll(); defaultChoices();
}

/* ---- 回忆 ---- */
function openRecall(){
  const recall=loadRecall();
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">📜 回忆录</h2>';
  if(!recall.length){ h+='<p class="small">尚无回忆。一世终结（陨落或飞升）后，可存入回忆录。</p>'; }
  recall.slice().reverse().forEach(e=>{
    h+='<div class="frame" style="padding:10px;margin:8px 0">';
    h+='<div class="seal">'+e.name+'（'+e.sex+'·'+e.realmName+'）— '+e.end+'</div>';
    h+='<div class="small">出身'+e.origin+'，灵根'+e.root+'('+e.rootq+')，主修'+e.prof+'，享寿'+e.age+'载</div>';
    h+='<div class="small">主要成就：斩敌'+(e.ach.slain||0)+' · 采药'+(e.ach.herbs||0)+' · 突破'+(e.ach.breaks||0)+' · 奇缘'+(e.ach.fortunes||0)+' · 炼丹'+(e.ach.pills||0)+' · 夺魁'+(e.ach.arena||0)+' · 猎兽'+(e.ach.hunt||0)+(e.ach.heir?' · 开枝散叶':'')+(e.ach.companion?' · 得遇道侣':'')+'</div>';
    if(e.highlights&&e.highlights.length){ h+='<div class="mtip">光辉时刻：</div>'; e.highlights.forEach(x=>h+='<div class="small">'+x+'</div>'); }
    if(e.heir){
      const hs=(e.heirs&&e.heirs.length)?e.heirs:[{name:e.heirName,sex:'?',root:e.root,rootq:e.rootq}];
      h+='<div class="small" style="color:var(--seal)">❖ 留有后裔 '+hs.length+' 名：'+hs.map(x=>x.name+'（'+x.sex+'·'+x.root+'灵根）').join('、')+'，可于开局时择一「继承」。</div>';
    }
    h+='</div>';
  });
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="closeModal()">合上</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}

/* ---- 返回主页（存档 / 删除 / 直接返回） ---- */
function openHome(){
  const box=document.getElementById('modalBox');
  const d=localStorage.getItem(SAVE_KEY+CUR_SLOT);
  let info='（该档尚无存档）';
  if(d){ try{ const s=JSON.parse(d); info=s.name+' · '+REALMS[s.ri].name+SUBNAME[s.si]+' · '+s.age+'岁'; }catch(_){} }
  let h='<h2 class="seal">🏮 返回主页</h2>';
  h+='<p class="small">当前档位 '+CUR_SLOT+'：'+info+'</p>';
  h+='<p class="small">返回前请先处置此世：<b>存档</b>可保进度，<b>直接返回</b>则不留痕迹，<b>删除</b>会抹去该档存档（不可复原）。</p>';
  h+='<div class="center" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">';
  h+='<button class="btn" onclick="homeSave()">💾 存档后返回</button>';
  h+='<button class="btn ghost" onclick="homeDirect()">直接返回（不存档）</button>';
  h+='<button class="btn ghost" onclick="confirmDelSlot()">🗑 删除此档</button>';
  h+='<button class="btn ghost" onclick="closeModal()">取消</button>';
  h+='</div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function homeSave(){ saveGame(); goHome(); }
function homeDirect(){ log('（未存档，此世消散于风中。）','sys'); goHome(); }
function confirmDelSlot(){
  const box=document.getElementById('modalBox');
  box.innerHTML='<h2 class="seal">⚠ 确认删除档位 '+CUR_SLOT+'？</h2>'+
    '<p class="small">此举将永久抹去档位'+CUR_SLOT+'的存档，<b>不可复原</b>。</p>'+
    '<div class="center" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" onclick="doDelSlot()">确认删除</button>'+
    '<button class="btn ghost" onclick="openHome()">我再想想</button></div>';
}
function doDelSlot(){
  try{ localStorage.removeItem(SAVE_KEY+CUR_SLOT); }catch(_){}
  log('🗑 档位'+CUR_SLOT+'已抹去。','sys');
  goHome();
}
function goHome(){
  COMBAT=null;
  document.getElementById('modal').classList.remove('show');
  document.getElementById('game').style.display='none';
  document.getElementById('create').style.display='block';
  renderSlotHint();
}

/* ---- 继承开局 ---- */
function openInherit(){
  const recall=loadRecall().filter(e=>e.heir);
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">❖ 继承开局</h2><p class="small">择一先辈之后裔，承其遗泽，再启新世（自襁褓始）。</p>';
  if(!recall.length){ h+='<p class="small">尚无可继承的先辈（需前世留有后裔）。</p>'; }
  recall.slice().reverse().forEach(e=>{
    const hs=(e.heirs&&e.heirs.length)?e.heirs:[{name:e.heirName||'？',sex:'男',root:e.root,rootq:e.rootq}];
    hs.forEach((c,idx)=>{
      h+='<div class="shopitem"><span>'+e.name+' 之后裔【'+c.name+'】（'+c.sex+'·'+c.root+'灵根·'+c.rootq+'）<br><span class="small">遗泽：灵石'+e.inherit.spirit+' · '+(e.inherit.weapon||'无兵')+' · '+(e.inherit.armor||'无甲')+'</span></span>'+
         '<button class="btn sm" onclick="startInherit('+e.id+','+idx+')">继承</button></div>';
    });
  });
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="closeModal()">返回</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function startInherit(id, idx){
  const recall=loadRecall(); const e=recall.find(x=>x.id===id);
  if(!e){ log('无此先辈。','sys'); return; }
  closeModal();
  const hs=(e.heirs&&e.heirs.length)?e.heirs:[{name:e.heirName||genName('男','fan'),sex:'男',root:e.root,rootq:e.rootq}];
  const ch=(idx!=null && hs[idx]) ? hs[idx] : hs[hs.length-1];
  const childName=ch.name || e.heirName || genName('男','fan');
  const origin=e.origin, root=ch.root||e.root, rootq=ch.rootq||e.rootq, prof=e.prof;
  const gen=(rootq==='天灵根')?rnd(70,92):rnd(45,75);
  const wu=(rootq==='天灵根')?rnd(68,88):rnd(45,72);
  const startLoc=(origin==='妖修')?'yaojie':(origin==='魔修')?'mojie':'changan';
  S={
    name:childName, sex:ch.sex||(Math.random()<0.5?'男':'女'), age:0, origin, root, rootq, prof,
    ri:0, si:0, prog:0, HP:0, MP:0, EN:100, SH:0, maxHP:0, maxMP:0, maxShen:0,
    gen, wu, fu:rnd(40,80), rong:rnd(45,82), mei:rnd(45,88), yun:rnd(40,90),
    weapon:e.inherit.weapon, armor:e.inherit.armor, ring:null,
    spirit:{下:e.inherit.spirit,中:0,上:0,极:0}, gold:e.inherit.gold, bag:{'聚气散':2,'疗伤丹':1},
    wp:(e.inherit.wp&&e.inherit.wp.length)?e.inherit.wp.slice():['引气诀'],
    skills:[PROFS[prof].skill.name],
    loc:startLoc, year:1, month:1, day:1, shichen:5, weather:'晴', status:[],
    family:{bg:'你乃'+e.name+'之后裔，承其遗泽降生。', home:startLoc, surname:childName[0]||'某', members:[{rel:'先父',name:e.name}], visited:false},
    companion:null, 后代:[], hasHeir:false,
    ach:{slain:0,herbs:0,breaks:0,fortunes:0,realmMax:0,cities:{},companion:false,heir:false,pills:0,arena:0,hunt:0},
    orders:[], inheritedFrom:e.name
  };
  recalcMax(); S.HP=S.maxHP; S.MP=S.maxMP; S.SH=S.maxShen;
  document.getElementById('create').style.display='none';
  document.getElementById('game').style.display='grid';
  logEl=document.getElementById('log'); choicesEl=document.getElementById('choices'); logEl.innerHTML='';
  log('❖ 你承【'+e.name+'】之遗泽降生，自襁褓始，血脉里流淌着前世的修为与故事。','ev');
  log('（继承开局：灵石、兵器、功法皆承自先辈；这一世，由你书写。）','sys');
  if(S.age<ADULT_AGE) log('（你尚年幼，眼下只可行稚子之事；及冠之年（16岁）方开三界之路。）','sys');
  renderAll(); saveGame(true); event_arrive(); showWorldview();
}

/* ---- 家族面板 ---- */
function openFamily(){
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">🏠 家族</h2>';
  if(S.family){ h+='<div class="mtip">—— 长辈 ——</div>'; S.family.members.forEach(m=>{ h+='<div class="small">'+m.rel+'·'+m.name+(m.bg?'（'+m.bg+'）':'')+'</div>'; }); }
  const _famc=S.companions.filter(c=>c.married);
  if(_famc.length){ h+='<div class="mtip">—— 道侣（'+_famc.length+' 位） ——</div>'; _famc.forEach((c,mi)=>{ h+='<div class="small">第'+ordCn(mi+1)+'任道侣 · '+c.name+'（'+c.ident+'·好感'+Math.round(c.fav)+'）'+(c.bg?'　身世：'+c.bg:'')+'</div>'; }); }
  if(S.后代&&S.后代.length){ h+='<div class="mtip">—— 后裔（指定「继承灵石」者，离世后可得遗泽；传承功法圆满可亲传） ——</div>'; S.后代.forEach((c,i)=>{ const inh=(S.inheritHeir===i); const canPass=inheritGongsFull().length>0; const rk=c.parent?marriedRank(c.parent):0; h+='<div class="shopitem"><span>'+c.name+'（'+c.sex+'·'+c.root+'灵根·'+c.rootq+'）'+(c.parent?('　（与'+(rk?('第'+ordCn(rk)+'任道侣·'):'')+'【'+c.parent+'】所出）'):'')+(inh?'　✔继承灵石':'')+(c.inheritGong?'　已传功【'+c.inheritGong+'】':'')+(c.pet?'　灵宠'+c.pet:'')+'</span><button class="btn sm" onclick="setHeir('+i+')">'+(inh?'取消继承':'指定继承')+'</button>'+(canPass?'<button class="btn sm ghost" onclick="passGongToHeir('+i+')">传功</button>':'')+'</div>'; }); }
  else h+='<div class="small">（尚无后裔）</div>';
  if(S.pets&&S.pets.length&&S.后代&&S.后代.length){ h+='<div class="mtip">—— 将灵宠赐予后裔相伴 ——</div>'; S.pets.forEach((p,pi)=>{ h+='<div class="shopitem"><span>灵宠'+p.name+' →</span>'+S.后代.map((c,i)=>'<button class="btn sm ghost" onclick="givePet('+pi+','+i+')">'+c.name+'</button>').join(' ')+'</div>'; }); }
  else h+='<div class="small">（需同时拥有灵宠与后裔，方可赐予）</div>';
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="closeModal()">关闭</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function setHeir(i){ if(S.inheritHeir===i) S.inheritHeir=null; else S.inheritHeir=i; log('你'+(S.inheritHeir===i?'指定':'取消指定')+'【'+(S.后代[i]?S.后代[i].name:'')+'】继承你的灵石遗泽。','good'); openFamily(); }
function givePet(pi,ci){ const p=S.pets[pi]; if(!p) return; if(S.后代[ci].pet){ S.pets.push({name:S.后代[ci].pet,beast:S.后代[ci].pet,lv:1,exp:0,loyalty:50,full:80,equip:{武器:null,防具:null}}); } S.后代[ci].pet=p.name; S.pets.splice(pi,1); log('🐾 你将灵宠【'+p.name+'】赐予'+S.后代[ci].name+'作伴。','good'); renderAll(); openFamily(); }
// 传承功法圆满（Lv5）方可亲传后裔（V1.8）
function inheritGongsFull(){ return (S.wp||[]).filter(g=> GONGS[g] && GONGS[g].tier==='传承' && gongLv(g)>=5); }
function passGongToHeir(i){
  const c=S.后代[i]; if(!c) return;
  const full=inheritGongsFull();
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">📜 亲传功法予【'+c.name+'】</h2><p class="small">择一门已圆满（Lv5）的传承功法亲授；你离世后，此功法随遗泽一并传下，后裔开局即承此道统。</p>';
  if(!full.length) h+='<p class="small">你尚无圆满（Lv5）的传承功法可传。传承功法需于「修炼→参悟」练至 Lv5 巅峰。</p>';
  else full.forEach(g=>{ h+='<div class="shopitem"><span>'+g+'（Lv'+gongLv(g)+'）</span><button class="btn sm" onclick="doPassGong('+i+',\''+g+'\')">传</button></div>'; });
  h+='<div class="center" style="margin-top:8px"><button class="btn ghost" onclick="openFamily()">返回</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function doPassGong(i,g){
  if(!S.后代[i]) return;
  S.后代[i].inheritGong=g;
  log('📜 你将圆满传承功法【'+g+'】亲授于后裔【'+S.后代[i].name+'】，血脉相承，道统不灭。','good');
  openFamily();
}

/* ===================== 宗门系统（V1.8） ===================== */
const RIVAL_SECTS=['血煞门','玄阴教','焚天谷','幽影阁','万剑山庄','碧波宫','天魔殿','凌霄宗'];
function sectPower(){
  let p = S.ri*40+60+S.gen*0.3;   // 自身战力
  if(S.sect) S.sect.disciples.forEach(d=>{ p += d.realm*30 + d.loyal*0.25; });
  return Math.round(p);
}
function sectUpkeep(){ return S.sect ? Math.round(S.sect.disciples.length*30 + S.sect.level*100) : 0; }
function newDisciple(role){
  const realm=clamp(S.ri - rnd(0,3), 0, 8);
  return { name:genName(Math.random()<0.5?'男':'女','fan'), role:role||pick(['外门','内门','核心']), realm, loyal:rnd(40,80) };
}
function openSect(){
  const box=document.getElementById('modalBox');
  if(!S.sect){
    const ok = S.ri>=4 && S.fame>=100 && S.gold>=2000 && S.spirit.下>=800;
    let h='<h2 class="seal">⛩ 宗门</h2>';
    h+='<p class="small">开宗立派，需自身修为、声名、资财俱足，方能广纳门徒、开枝散叶。</p>';
    h+='<div class="mtip">—— 立派之资 ——</div>';
    h+='<div class="small">境界≥化神（'+REALMS[Math.min(S.ri,8)].name+'，'+(S.ri>=4?'已足':'未达')+'）　声望≥100（'+S.fame+'，'+(S.fame>=100?'已足':'未达')+'）　金银≥2000（'+Math.floor(S.gold)+'，'+(S.gold>=2000?'已足':'未达')+'）　下品灵石≥800（'+S.spirit.下+'，'+(S.spirit.下>=800?'已足':'未达')+'）</div>';
    if(ok) h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="foundSect()">⚑ 开宗立派</button></div>';
    else h+='<p class="small">（资财/修为未足，暂不能立派。）</p>';
    h+='<div class="center" style="margin-top:8px"><button class="btn ghost" onclick="closeModal()">关闭</button></div>';
    box.innerHTML=h; document.getElementById('modal').classList.add('show'); return;
  }
  const sct=S.sect;
  let h='<h2 class="seal">⛩ '+sct.name+'（'+['微末','小宗','名门','大派','圣地'][sct.level-1]+'·Lv'+sct.level+'）</h2>';
  h+='<div class="small">门下弟子 '+sct.disciples.length+' 人　宗门实力 '+sectPower()+'　每年供养耗 下品灵石'+sectUpkeep()+'、金银'+Math.round(sct.level*50)+'</div>';
  h+='<div class="mtip">—— 弟子 ——</div>';
  if(!sct.disciples.length) h+='<div class="small">（尚无弟子）</div>';
  else sct.disciples.forEach(d=>{ h+='<div class="small">· '+d.name+'（'+d.role+'·'+REALMS[Math.min(d.realm,8)].name+'·忠诚'+Math.round(d.loyal)+'）</div>'; });
  h+='<div class="center" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center">';
  h+='<button class="btn sm" onclick="recruitDisciple()">招收弟子</button>';
  h+='<button class="btn sm" onclick="sendCommission()">派遣核心弟子·采办</button>';
  h+='<button class="btn sm" onclick="sectWar()">⚔ 宗门之战</button>';
  h+='<button class="btn sm" onclick="sectUpgrade()">扩建山门(Lv'+(sct.level+1)+')</button>';
  h+='<button class="btn sm ghost" onclick="sectDisband()">解散宗门</button>';
  h+='<button class="btn sm ghost" onclick="closeModal()">关闭</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function foundSect(){
  S.sect={ name:S.name+'之'+pick(['道统','宗','门','阁']), founded:S.year, level:1, disciples:[] };
  S.gold-=2000; S.spirit.下-=800;
  const n=rnd(2,3);
  for(let i=0;i<n;i++) S.sect.disciples.push(newDisciple('内门'));
  log('⚑ 你于【'+LOCATIONS[S.loc].name+'】开宗立派，号「'+S.sect.name+'」！初纳门人 '+n+' 名，道统初立。','ev');
  renderAll(); openSect();
}
function recruitDisciple(){
  if(!S.sect) return openSect();
  if(S.sect.disciples.length>=8+S.sect.level*2){ log('门人已众（'+S.sect.disciples.length+'），暂不便再纳。','sys'); return openSect(); }
  const role = Math.random()<0.25?'核心':(Math.random()<0.5?'内门':'外门');
  const d=newDisciple(role); S.sect.disciples.push(d);
  log('🙇 一名'+role+'弟子【'+d.name+'】（'+REALMS[Math.min(d.realm,8)].name+'）投入「'+S.sect.name+'」门下。','good');
  renderAll(); openSect();
}
function sendCommission(){
  if(!S.sect) return openSect();
  const core=S.sect.disciples.filter(d=>d.role==='核心');
  if(!core.length){ log('门下尚无「核心」弟子可遣，先招收或提拔弟子。','sys'); return openSect(); }
  const d=pick(core); const yrs=rnd(1,3); advanceTime(yrs);
  const herb=pick(LOCATIONS[S.loc].herbs||['聚气草']); S.bag[herb]=(S.bag[herb]||0)+rnd(1,3);
  if(S.ach) S.ach.herbs+=1;
  const pay=rnd(30,120)+S.sect.level*20; S.spirit.下+=pay;
  d.loyal=clamp(d.loyal+5,0,100);
  log('📦 核心弟子【'+d.name+'】奉命采办 '+yrs+' 年归来，献上【'+herb+'】若干与下品灵石 '+pay+'。','good');
  renderAll(); openSect();
}
function sectUpgrade(){
  if(!S.sect) return openSect();
  const cost={gold:1000*S.sect.level, sp:400*S.sect.level};
  if(S.gold<cost.gold || S.spirit.下<cost.sp){ log('扩建山门需 金银'+cost.gold+'、下品灵石'+cost.sp+'，资财不足。','bad'); return openSect(); }
  S.gold-=cost.gold; S.spirit.下-=cost.sp; S.sect.level++;
  log('🏯 「'+S.sect.name+'」山门扩建至 Lv'+S.sect.level+'！可纳更多门人，声势更盛。','good');
  renderAll(); openSect();
}
function sectDisband(){
  if(!S.sect) return;
  const nm=S.sect.name; S.sect=null;
  log('🏚 你散去「'+nm+'」门人，宗门就此消散，道统归于个人修行。','sys');
  renderAll(); openSect();
}
function sectYearTick(){
  if(!S.sect) return;
  const up=sectUpkeep(), goldUp=Math.round(S.sect.level*50);
  let broke=false;
  if(S.spirit.下>=up) S.spirit.下-=up; else { S.spirit.下=0; broke=true; }
  if(S.gold>=goldUp) S.gold-=goldUp; else { S.gold=0; broke=true; }
  let income=0;
  S.sect.disciples.forEach(d=>{ if(d.role==='核心'){ const pay=rnd(20,80)+S.sect.level*15; S.spirit.下+=pay; income+=pay; d.loyal=clamp(d.loyal+2,0,100); } });
  if(Math.random() < clamp(0.3 + S.fame/500, 0, 0.8) && S.sect.disciples.length < 8+S.sect.level*2){
    const role=Math.random()<0.2?'核心':(Math.random()<0.5?'内门':'外门');
    const d=newDisciple(role); S.sect.disciples.push(d);
    log('🙇 新岁，「'+S.sect.name+'」又得一名'+role+'弟子【'+d.name+'】投入门下。','sys');
  }
  if(broke){
    const lost=S.sect.disciples.splice(0,1);
    if(lost.length) log('💸 宗门资财不济，弟子【'+lost[0].name+'】心灰意冷，离门而去。','bad');
    S.fame=Math.max(0,S.fame-3);
  } else if(income>0){
    log('🏯 「'+S.sect.name+'」又历一岁：核心弟子采办进项 下品灵石'+income+'，门庭渐盛。','sys');
  }
}
function sectWar(){
  if(!S.sect) return openSect();
  if(S.sect.disciples.length<1){ log('门人凋零，无从应战。','sys'); return openSect(); }
  const foe=pick(RIVAL_SECTS);
  const foePow=Math.round((S.ri*40+60) * (0.7+Math.random()*1.1) + rnd(50,400));
  const myPow=sectPower();
  const ratio = myPow/(myPow+foePow);
  eventPopup('⚔ 宗门之战 · '+foe,
    '<p>「'+S.sect.name+'」与【'+foe+'】毗邻生隙，终至兵戎相见。我方实力 '+myPow+'，敌方实力 '+foePow+'，胜负须权衡实力。</p>',
    [{t:'倾门迎战（实力定胜负）', act:()=>{
       const win = Math.random() < ratio;
       if(win){
         const loot=rnd(200,800)+S.sect.level*100; S.spirit.下+=loot; S.fame+=15;
         const cap=Math.random()<0.4; if(cap){ const d=newDisciple(pick(['核心','内门'])); S.sect.disciples.push(d); }
         log('🏆 「'+S.sect.name+'」大破【'+foe+'】！夺下品灵石 '+loot+'，声望 +15'+(cap?'，并收编敌方一名弟子':''),'good');
       } else {
         const loss=rnd(100,400); S.spirit.下=Math.max(0,S.spirit.下-loss); S.fame=Math.max(0,S.fame-8);
         if(S.sect.disciples.length>0 && Math.random()<0.5){ const f=S.sect.disciples.splice(0,1); if(f.length) log('⚰ 此战折损弟子【'+f[0].name+'】。','bad'); }
         log('⚔ 「'+S.sect.name+'」不敌【'+foe+'】，损兵折将，失下品灵石 '+loss+'、声望 -8。','bad');
       }
       renderAll(); openSect();
     }},
     {t:'避其锋芒（按兵不动）', act:()=>{ log('你权衡实力，暂不与【'+foe+'】硬碰，按兵不动。','sys'); renderAll(); openSect(); }}]);
}

/* ---- 比武：自选对手 ---- */
function arenaFight(i){
  const o=window.__arena&&window.__arena[i]; if(!o) return;
  document.getElementById('modal').classList.remove('show');
  const pw=S.ri*40+60+S.gen*0.3, ew=o.eri*40+60+PROFS[o.eprof].atk*20;
  const p=clamp(0.5+(pw-ew)/200+(S.wu-50)/200,0.15,0.95);
  if(Math.random()<p){
    const reward=rnd(80,200)+S.ri*40; S.spirit.下+=reward; S.fame+=10; if(S.ach)S.ach.arena++;
    log('🏆 你于比武大会力克【'+o.name+'】('+REALMS[o.eri].name+'·'+o.eprof+'·强度'+o.strength+'%)，夺魁！声望 +10，下品灵石 '+reward+'。','good');
    if(Math.random()<0.3){ const g=pick(INHERIT_GONGS.concat(['太玄经','九转玄功','磐石诀','御剑斩','五行法术','雷符爆'])); learnGong(g); }
    if(marriedCompanions().length && Math.random()<0.4){ rivalEvent(); return; }
  } else {
    const reward=rnd(10,40); S.spirit.下+=reward; S.fame+=2;
    S.HP=clamp(S.HP-S.maxHP*0.2,1,S.maxHP);
    log('你与【'+o.name+'】激战不敌，惜败。声望 +2，彩头灵石 '+reward+'。','sys');
  }
  renderAll(); defaultChoices();
}
function rivalEvent(){
  const mc=marriedCompanions(); if(!mc.length) return;
  const c=pick(mc);
  const rival=genName('男', Math.random()<0.5?'hong':'fan');
  eventPopup('💘 情敌现身', '<p>你比武扬名，却引来【'+rival+'】对'+c.name+'的青睐。'+rival+'登门相邀，欲与你对'+c.name+'之心意一较高下。</p>',
    [{t:'以武夺心（胜则好感大涨，败则情危）', act:()=>{
       const eprof=pick(Object.keys(PROFS)); const pw=S.ri*40+60+S.gen*0.3, ew=S.ri*40+60+PROFS[eprof].atk*20;
       const p=clamp(0.5+(pw-ew)/200,0.2,0.9);
       if(Math.random()<p){ c.fav=Math.min(99,c.fav+15); log('你于情场亦胜，'+c.name+'更倾心于你（好感'+c.fav+'）。','good'); }
       else { c.fav=Math.max(0,c.fav-12); log('你惜败于情敌，'+c.name+'心中微澜（好感'+c.fav+'）。','bad'); if(c.fav<=0){ removeCompanion(c); log('💔 '+c.name+'终是倾心他人，与你分道扬镳。','sys'); } }
       advanceTime(rnd(1,3)); renderAll(); defaultChoices();
    }},
     {t:'以情动人（言语周旋，好感略涨）', act:()=>{ c.fav=Math.min(99,c.fav+6); log('你以一片真心打动了'+c.name+'，情比金坚（好感'+c.fav+'）。','good'); advanceTime(rnd(1,2)); renderAll(); defaultChoices(); }},
     {t:'不以为意（放任，好感微降）', act:()=>{ c.fav=Math.max(0,c.fav-5); log('你对情敌不以为意，'+c.name+'却觉你薄情（好感'+c.fav+'）。','sys'); advanceTime(1); renderAll(); defaultChoices(); }},
    ]);
}
function ascTitle(e){ const a=e.ach; if((a.slain||0)>=30) return '伏魔真君'; if((a.arena||0)>=3) return '斗战仙尊'; if((a.fortunes||0)>=20) return '鸿运天仙'; if((a.pills||0)>=15) return '丹道仙翁'; if((a.heir)) return '福泽仙祖'; if((a.realmMax||0)>=7) return '渡劫仙尊'; return '无名飞升者'; }
function showAscend(e){
  const box=document.getElementById('modalBox');
  // 通关评定：飞升即通关主线；声望盖世、传承满身者，可称「三界共主」
  const overlord = (e.fame||0)>=200 && (e.inherits||0)>=1;
  let h='<h2 class="seal">🌟 通关 · 飞升成仙</h2>';
  h+='<p style="color:#b8860b;font-weight:bold">✦ 你已完成《三界录》主线结局——超脱三界，破碎虚空，得证大道。这一世，通了。'+(overlord?' 更以盖世声望与满身传承，被尊为【三界共主】！':'')+'</p>';
  h+='<p class="small">飞升非终点，而是另一段传说的开端。可开启「继承」血脉，或重开新世，再谱写一卷。</p>';
  h+='<div class="frame" style="padding:10px;margin:8px 0">';
  h+='<div class="seal">尊号：'+ascTitle(e)+(overlord?' · 三界共主':'')+'</div>';
  h+='<div class="small">终焉境界：'+REALMS[e.realmMax].name+SUBNAME[0]+'　一世享寿 '+e.age+' 载　声望 '+(e.fame||0)+'　传承 '+(e.inherits||0)+' 门</div>';
  h+='<div class="small">主要成就：斩敌'+(e.ach.slain||0)+' · 采药'+(e.ach.herbs||0)+' · 突破'+(e.ach.breaks||0)+' · 奇缘'+(e.ach.fortunes||0)+' · 炼丹'+(e.ach.pills||0)+' · 夺魁'+(e.ach.arena||0)+' · 猎兽'+(e.ach.hunt||0)+(e.ach.heir?' · 开枝散叶':'')+(e.ach.companion?' · 得遇道侣':'')+'</div>';
  h+='<div class="small">遗泽灵石：下 '+e.inherit.spirit+(S.inheritHeir!=null?'（已指定后裔全数继承）':'（后裔可得半数）')+'　传功 '+(e.inherit.wp&&e.inherit.wp.length?e.inherit.wp.join('、'):'无')+'</div>';
  if(e.highlights&&e.highlights.length){ h+='<div class="mtip">光辉时刻：</div>'; e.highlights.forEach(x=>h+='<div class="small">'+x+'</div>'); }
  h+='</div>';
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="openRecall()">看回忆录</button><button class="btn ghost" onclick="location.reload()">重开新世</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}

/* 启动即开帮助可注释；此处默认进入创建 */
</script>

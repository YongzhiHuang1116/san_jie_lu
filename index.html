<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修仙世界 · 三界录</title>
<style>
  :root{
    --ink:#2b2118; --ink2:#5a4a36; --paper:#f3e9d2; --paper2:#e9dcbf;
    --seal:#9e2b25; --gold:#9c7a2e; --line:#c9b48a; --good:#2f6b3a; --bad:#9e2b25;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Kaiti","STKaiti","楷体","Songti SC",serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(180,150,100,.25), transparent 50%),
      var(--paper);
    color:var(--ink); line-height:1.6;}
  #app{max-width:1180px;margin:0 auto;padding:14px;}
  h1,h2,h3{font-weight:700;letter-spacing:2px;margin:.2em 0}
  .seal{color:var(--seal)}
  .frame{border:2px solid var(--line);border-radius:8px;background:rgba(255,255,255,.35);
    box-shadow:0 2px 10px rgba(120,90,40,.18) inset, 0 1px 0 #fff;}
  /* 创建界面 */
  #create{padding:22px}
  #create .row{display:flex;flex-wrap:wrap;gap:10px 18px;margin:10px 0}
  #create label{display:flex;flex-direction:column;font-size:14px;color:var(--ink2)}
  #create input,#create select{padding:6px 8px;border:1px solid var(--line);border-radius:5px;
    background:#fff8ec;font-family:inherit;font-size:15px;color:var(--ink);margin-top:3px}
  .sectitle{border-left:5px solid var(--seal);padding-left:10px;margin-top:18px;color:var(--seal)}
  .btn{cursor:pointer;border:1px solid var(--seal);background:var(--seal);color:#fff8ec;
    padding:8px 16px;border-radius:6px;font-family:inherit;font-size:15px;letter-spacing:1px;
    transition:.15s; box-shadow:0 2px 0 #6f1d19}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(2px);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--seal)}
  .btn.sm{padding:5px 10px;font-size:13px}
  /* 游戏界面 */
  #game{display:none;grid-template-columns:300px 1fr 250px;gap:12px}
  @media(max-width:1000px){#game{grid-template-columns:1fr}}
  .panel{padding:12px;max-height:82vh;overflow:auto}
  #topbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    padding:10px 14px;font-size:14px}
  #topbar b{color:var(--seal)}
  .stat-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px}
  .bar{height:9px;background:#d8c7a0;border-radius:5px;overflow:hidden;margin:2px 0 6px}
  .bar>i{display:block;height:100%}
  .hp>i{background:linear-gradient(90deg,#c0392b,#e74c3c)}
  .mp>i{background:linear-gradient(90deg,#2471a3,#5dade2)}
  .en>i{background:linear-gradient(90deg,#b7950b,#f1c40f)}
  .sh>i{background:linear-gradient(90deg,#6c3483,#bb8fce)}
  #log{height:52vh;overflow:auto;padding:12px;font-size:15px}
  #log .line{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
  #log .ev{color:var(--seal);border-color:var(--seal)}
  #log .good{color:var(--good);border-color:var(--good)}
  #log .bad{color:var(--bad);border-color:var(--bad)}
  #log .sys{color:var(--ink2);font-style:italic;border-color:#d8c7a0}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .free{display:flex;gap:8px;margin-top:10px}
  .free input{flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;
    background:#fff8ec;font-family:inherit;font-size:14px}
  .mapbtn{display:block;width:100%;text-align:left;margin:4px 0;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.4);padding:6px 9px;border-radius:5px;
    font-family:inherit;font-size:13px;color:var(--ink)}
  .mapbtn:hover{background:#fff3dc}
  .mapbtn.cur{background:var(--seal);color:#fff8ec;border-color:var(--seal)}
  .bag{font-size:12px;max-height:30vh;overflow:auto}
  .bag div{padding:2px 0;border-bottom:1px dashed var(--line)}
  .small{font-size:12px;color:var(--ink2)}
  .tag{display:inline-block;background:var(--gold);color:#fff;font-size:11px;padding:1px 6px;border-radius:3px;margin-right:4px}
  .tag.r{background:var(--seal)}
  .modal{position:fixed;inset:0;background:rgba(40,30,20,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{width:min(640px,92vw);max-height:88vh;overflow:auto;padding:18px;background:var(--paper);border:2px solid var(--seal);border-radius:10px}
  .shopitem{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:6px;border-bottom:1px dashed var(--line);font-size:14px}
  .center{text-align:center}
  .mtip{color:var(--seal);font-size:13px;margin:6px 0}
  .winbig{font-size:22px;color:var(--seal);text-align:center;margin:10px 0}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 角色创建 ============ -->
  <div id="create" class="frame">
    <h1 class="center">✦ 修仙世界 · 三界录 ✦</h1>
    <p class="center small" id="verLine"></p>

    <div class="sectitle">🗂 选档 / 继承</div>
    <div class="row" id="slotRow">
      <button class="btn sm" id="slotBtn1" onclick="pickSlot(1)">档位1</button>
      <button class="btn sm ghost" id="slotBtn2" onclick="pickSlot(2)">档位2</button>
      <button class="btn sm ghost" id="slotBtn3" onclick="pickSlot(3)">档位3</button>
      <button class="btn sm ghost" onclick="openSlots()">管理档位</button>
      <button class="btn sm" onclick="openInherit()">❖ 继承开局</button>
    </div>
    <div class="small" id="slotHint" style="margin-top:-4px"></div>

    <div class="sectitle">✦ 开局模式</div>
    <div class="row">
      <button class="btn sm" id="mDetail" onclick="selectMode('detail')">🖋 详细创建（自选天赋·灵根·职业）</button>
      <button class="btn sm ghost" id="mQuick" onclick="selectMode('quick')">🎲 快速开局（仅填姓名性别，其余随机）</button>
    </div>

    <div class="sectitle">① 基础信息</div>
    <div class="row">
      <label>姓名<input id="c_name" value="王狗儿" maxlength="8"></label>
      <label>性别<select id="c_sex"><option>男</option><option>女</option></select></label>
    </div>

    <div id="detailFields">
      <div class="row">
        <label>年龄<input id="c_age" type="number" value="18" min="8" max="80"></label>
      </div>

      <div class="sectitle">② 出身 / 势力</div>
      <div class="row">
        <label>身份（决定初始资源与剧情起点）
          <select id="c_origin">
            <option value="宗门弟子">宗门弟子（上三宗/下三宗）</option>
            <option value="世家子弟">修仙世家子弟</option>
            <option value="散修">散修（无门无派）</option>
            <option value="凡人平民">凡人平民</option>
            <option value="妖修">妖修（妖界出身）</option>
            <option value="魔修">魔修（魔界出身）</option>
          </select>
        </label>
      </div>

      <div class="sectitle">③ 修行资质</div>
      <div class="row">
        <label>灵根属性
          <select id="c_root">
            <option>金</option><option>木</option><option>水</option><option>火</option>
            <option>土</option><option>风</option><option>雷</option><option>光</option>
            <option>暗</option><option>杂灵根（多属性）</option>
          </select>
        </label>
        <label>灵根品级
          <select id="c_rootq">
            <option value="天灵根">天灵根（单属性·修炼最快）</option>
            <option value="双灵根">双灵根</option>
            <option value="三灵根">三灵根</option>
            <option value="四灵根">四灵根</option>
            <option value="五灵根">五灵根（五行俱全）</option>
          </select>
        </label>
        <label>主修职业
          <select id="c_prof">
            <option>剑修</option><option>法修</option><option>体修</option><option>符修</option>
            <option>阵修</option><option>丹修</option><option>药修</option><option>蛊修</option>
            <option>器修</option><option>妖修</option><option>魔修</option>
          </select>
        </label>
      </div>
      <p class="mtip small">提示：天灵根→根骨/悟性更高；杂灵根→福缘更高但修炼慢。职业决定战斗风格，详见游戏内说明。</p>
    </div>
    <div class="center" style="margin-top:10px">
      <button class="btn" onclick="startGame()">✦ 确认入世，开始游戏 ✦</button>
    </div>
  </div>

  <!-- ============ 游戏主界面 ============ -->
  <div id="game">
    <div id="topbar" class="frame">
      <span>⏳ <b id="t_time"></b></span>
      <span>📍 <b id="t_loc"></b></span>
      <span>🌤 <b id="t_weather"></b></span>
      <span id="t_realm" class="tag r"></span>
      <span style="flex:1"></span>
      <button class="btn sm ghost" onclick="saveGame()">存档</button>
      <button class="btn sm ghost" onclick="openSlots()">选档</button>
      <button class="btn sm ghost" onclick="openFamily()">🏠 家族</button>
      <button class="btn sm ghost" onclick="openInterpersonal()">💞 人际</button>
      <button class="btn sm ghost" onclick="openPet()">🐾 灵宠</button>
      <button class="btn sm ghost" onclick="openSect()">⛩ 宗门</button>
      <button class="btn sm ghost" onclick="openBag()">🎒 行囊</button>
      <button class="btn sm ghost" onclick="openRecall()">回忆</button>
      <button class="btn sm ghost" onclick="openHelp()">玩法</button>
      <button class="btn sm ghost" onclick="openHome()">🏮 返回主页</button>
    </div>

    <!-- 左：状态 -->
    <div class="panel frame" id="statusPanel"></div>

    <!-- 中：剧情/日志 -->
    <div class="frame" style="display:flex;flex-direction:column">
      <div id="log"></div>
      <div class="choices" id="choices"></div>
      <div class="free">
        <input id="freeInput" placeholder="自由行动，或点「指令」选行动，例如：修炼 / 前往长安城 / 采药 / 出手 / 使用疗伤丹" onkeydown="if(event.key==='Enter')sendFree()">
        <button class="btn ghost" onclick="openCmdMenu()">指令</button>
        <button class="btn" onclick="sendFree()">行动</button>
      </div>
    </div>

    <!-- 右：地图 + 背包 -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="panel frame">
        <h3 class="seal">🗺 三界舆图</h3>
        <div id="map"></div>
      </div>
      <div class="panel frame">
        <h3 class="seal">🎒 行囊</h3>
        <div class="bag" id="bag"></div>
      </div>
    </div>
  </div>

</div>

<!-- 商店/模态 -->
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

function genFamily(){
  const bg = FAMILY_BG[S.origin] ? pick(FAMILY_BG[S.origin]) : '你身世寻常，父母皆是芸芸众生之一。';
  const isShi = (S.origin==='世家子弟'||S.origin==='宗门弟子');
  const faName = genName('男', isShi?'shi':'fan');
  const moName = genName('女', isShi?'shi':'fan');
  const members=[{rel:'父亲',name:faName},{rel:'母亲',name:moName}];
  if(Math.random()<0.5) members.push({rel:Math.random()<0.5?'兄':'姐', name:genName(Math.random()<0.5?'男':'女','fan')});
  const surname = (isShi? S.name : (S.name[0]||'某'));
  const home = (S.origin==='妖修')?'yaojie':(S.origin==='魔修')?'mojie':'changan';
  return { bg, home, surname, members, visited:false };

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function realmStats(){
  const r = REALMS[S.ri]; const m = SUB[S.si];
  let blood=0; if(S.wp) S.wp.forEach(g=>{ if(GONGS[g]&&GONGS[g].attr==='血') blood+=0.04*(S.gongLv[g]||1); });
  // 神识随境界与小境增长，并受悟性牵引——悟性越高，神识上限越高（V1.8）
  const shenBase = r.shen*m*(1 + (S.wu||50)/250);
  return {
    hp: Math.round(r.hp*m*(1+(S.rootq==='天灵根'?0.1:0))*(1+blood)),
    mp: Math.round(r.mp*m),
    shen: Math.round(shenBase),
    shou: r.shou
  };
}
function recalcMax(){
  const st = realmStats();
  S.maxHP = st.hp; S.maxMP = st.mp; S.maxShen = st.shen;
}

function startGame(){
  const name = document.getElementById('c_name').value.trim() || '无名';
  const sex = document.getElementById('c_sex').value;
  let age = +document.getElementById('c_age').value;
  let origin = document.getElementById('c_origin').value;
  let root = document.getElementById('c_root').value;
  let rootq = document.getElementById('c_rootq').value;
  let prof = document.getElementById('c_prof').value;
  if(CREATE_MODE==='quick'){
    const _o=['宗门弟子','世家子弟','散修','凡人平民','妖修','魔修']; origin=pick(_o);
    root=pick(ROOTS);
    const _rq=['天灵根','双灵根','三灵根','四灵根','五灵根']; rootq=pick(_rq);
    prof=pick(Object.keys(PROFS));
    age=0;   // 快速开局：自襁褓始
  }

  // 资质
  let gen = (rootq==='天灵根')?rnd(75,95):(rootq==='双灵根')?rnd(60,82):(rootq==='三灵根')?rnd(50,72):(rootq==='四灵根')?rnd(42,62):rnd(38,58);
  let wu = (rootq==='天灵根')?rnd(72,92):(rootq==='双灵根')?rnd(58,80):(rootq==='三灵根')?rnd(48,70):(rootq==='四灵根')?rnd(40,62):rnd(36,56);
  let fu = (rootq==='杂灵根（多属性）')?rnd(70,95):rnd(35,70);
  let rong = rnd(40,80), mei = rnd(35,85), yun = rnd(30,90);

  // 初始资源
  let spirit = {下:0,中:0,上:0,极:0}, gold=0, weapon=null, armor=null, skill='引气诀', wp=[];
  if(origin==='宗门弟子'){ spirit.下=60; wp.push('聚气散×3','疗伤丹×2'); weapon='精钢飞剑'; }
  else if(origin==='世家子弟'){ spirit.下=200; spirit.中=5; gold=500; weapon='寒铁剑'; armor='玄铁甲'; wp.push('聚气散×5','疗伤丹×4','筑基丹×1'); }
  else if(origin==='散修'){ spirit.下=35; wp.push('聚气散×2','疗伤丹×1'); weapon='精钢飞剑'; }
  else if(origin==='凡人平民'){ spirit.下=10; gold=200; skill='粗浅吐纳'; }
  else if(origin==='妖修'){ spirit.下=40; wp.push('疗伤丹×2'); weapon='精钢飞剑'; }
  else if(origin==='魔修'){ spirit.下=40; wp.push('疗伤丹×2'); weapon='精钢飞剑'; }

  const startLoc = (origin==='妖修')?'yaojie':(origin==='魔修')?'mojie':'changan';

  S = {
    name, sex, age, origin, root, rootq, prof,
    ri:0, si:0, prog:0,           // 境界索引/小境/进度
    HP:0, MP:0, EN:100, SH:0,    // 生命/灵力/体力/神识(当前)
    maxHP:0, maxMP:0, maxShen:0,
    gen, wu, fu, rong, mei, yun,  // 根骨/悟性/福缘/容貌/魅力/气运
    weapon, armor, ring:null,
    spirit, gold, bag:{},          // bag: 名称->数量（丹药/符箓/灵草/材料）
    wp,                           // 功法列表
    skills:[PROFS[prof].skill.name],
    loc:startLoc, year:1, month:1, day:1, shichen:5, // 辰时
    weather:'晴', status:[], fame:0,
    pets:[], inheritHeir:null,   // V1.6：灵宠 / 指定继承灵石之后裔
    companions:[], friends:[], jealousy:null,  // V1.9：多线伴侣（道侣可并行攻略）/ 知己好友 / 争风吃醋标记
  };
  // 加入初始丹药
  wp.forEach(w=>{ const [n,c]=w.split('×'); S.bag[n]=(S.bag[n]||0)+(+c||1); });
  S.wp = [skill];
  S.mainGong = skill;
  S.gongLv = {}; S.gongLv[skill]=1;
  // 家族 / 伴侣 / 后裔 / 成就（V1.2）
  S.family = genFamily();
  S.companions = []; S.friends = []; S.jealousy = null;   // V1.9：多线伴侣 + 知己好友
  S.后代 = [];
  S.hasHeir = false;
  S.ach = {slain:0, herbs:0, breaks:0, fortunes:0, realmMax:0, cities:{}, companion:false, heir:false, pills:0, arena:0, hunt:0};
  S.orders = [];   // 寄售/委托订单（V1.4 市场）
  let inheritMsg=null;   // 世家/宗门传承（V1.7）：出身显赫者，开局即携一门独门传承功法与家传法器
  if(origin==='世家子弟' || origin==='宗门弟子'){
    const mySchool = PROF_SCHOOL[S.prof];
    const pool = INHERIT_GONGS.filter(g=> GONGS[g] && (S.prof==='魔修' ? GONGS[g].school==='魔' : mySchool && GONGS[g].school===mySchool));
    const g = pool.length ? pick(pool) : pick(INHERIT_GONGS);
    S.wp.push(g); S.gongLv[g]=1;   // 传承功法 Lv 上限5
    const eqPool = Object.keys(ITEMS).filter(k=> ITEMS[k].slot && (ITEMS[k].tier||1)>=3);
    const eq = pick(eqPool);
    if(ITEMS[eq].slot==='武器') S.weapon=eq; else if(ITEMS[eq].slot==='防具') S.armor=eq; else S.ring=eq;
    inheritMsg='🏛 出身显赫，你承袭家传绝学【'+g+'】与法器【'+eq+'】（传承功法可修至 Lv5）。';
  }
  recalcMax();
  S.HP=S.maxHP; S.MP=S.maxMP; S.SH=S.maxShen;

  document.getElementById('create').style.display='none';
  document.getElementById('game').style.display='grid';
  logEl=document.getElementById('log'); choicesEl=document.getElementById('choices');
  logEl.innerHTML='';
  if(inheritMsg) log(inheritMsg,'ev');
  let intro='✦ 你以【'+name+'】之名踏入修仙界。出身：'+origin+'，灵根：'+root+'（'+rootq+'），主修：'+prof+'.';
  if(CREATE_MODE==='quick') intro+='（快速开局，资质皆为天意随机，自襁褓始）';
  log(intro,'ev');
  log('🏠 身世：'+S.family.bg,'sys');
  if(CREATE_MODE==='quick') log('你自襁褓中睁眼，浑然不知此身将负何等因果……','sys');
  if(S.age<ADULT_AGE) log('（你尚年幼，眼下只可行稚子之事；及冠之年（16岁）方开三界之路。岁月自会推你长大。）','sys');
  log('天地不仁，以万物为刍狗；然修仙者不信命，以逆天改命为毕生之志。三界的故事，自你落笔。','sys');
  renderAll();
  saveGame(true);      // 记录到当前档位（开局静默，不刷屏）
  event_arrive();
  showWorldview();     // 世界观介绍弹窗
}

function sendFree(){
  const v=document.getElementById('freeInput').value.trim();
  document.getElementById('freeInput').value='';
  if(!v) return;
  parseCmd(v);
}
function parseCmd(v){
  const t=v.replace(/\s/g,'');
  if(/修炼|打坐|吐纳/.test(t)) return doCultivate();
  if(/功法|换功|参悟|易修/.test(t)) return doCultivate();
  if(/突破/.test(t)) return tryBreak();
  if(/前往|去|出发|传送/.test(t)){
    for(const id in LOCATIONS){ if(LOCATIONS[id].name.includes(t.replace(/前往|去|出发|传送/g,''))||t.includes(LOCATIONS[id].name)) return travelTo(id); }

  if(/休息|睡觉|睡眠|调息/.test(t)) return rest();
  if(/商店|买卖|交易|shop/i.test(t)) return openShop();
  if(/归家|双亲|探望/.test(t)) return familyVisit();
  if(/社交|结识|道侣/.test(t)) return social();
  if(/人际|交友|知己|伴侣|红颜|蓝颜/.test(t)) return openInterpersonal();
  if(/家族|亲人|家谱|长辈/.test(t)) return openFamily();
  if(/灵宠|宠物|妖兽/.test(t)) return openPet();
  if(/双修|同修|合欢/.test(t)) return social();
  if(/降服|收服|驯服/.test(t)) return beastHunt();
  if(/炼丹|丹房|炼制/.test(t)) return openRefine();
  if(/比武|擂台|大会/.test(t)) return tournament();
  if(/狩猎|猎兽|灵兽/.test(t)) return beastHunt();
  if(/主页|返回主页|退出/.test(t)) return openHome();
  if(/回忆/.test(t)) return openRecall();
  if(/选档|档位/.test(t)) return openSlots();

  if(/使用|服|吃|用/.test(t)){ const m=t.match(/使用?(.+)/); if(m) return useItemByName(m[1]); }

  if(/读档/.test(t)) return loadGame();
  if(/状态|属性/.test(t)){ renderAll(); return log('已刷新状态面板。','sys'); }

}

/* ===================== 时间 ===================== */
const WEATHERS=['晴','阴','雨','雪','雾','雷雨','酷暑','风沙'];
function advanceTime(shichen){
  S.shichen+=shichen;
  while(S.shichen>=12){
    S.shichen-=12; S.day++;
    if(S.day>30){ S.day=1; S.month++;
    if(S.month>12){ S.month=1; S.year++;
      if(S.age>=ADULT_AGE){ S.age++; log('🕰 又是一年春去秋来，你已 '+S.age+' 岁。','sys'); }
      sectYearTick();   // V1.8：宗门每年结算（消耗/招收/核心弟子采办）
    }
    }
  }
  S.weather = (S.loc==='mojie')?'魔煞弥漫':(S.loc==='yaojie')?'灵雾缭绕':pick(WEATHERS);
  // 状态计时
  S.status=S.status.filter(s=>{ if(s.turns!==undefined){ s.turns--; if(s.turns<=0){ log('【状态】'+s.t+'已消散。','good'); return false; } } return true; });
  // 自动机缘判定（战斗中不打断，避免破坏战斗流程）
  if(!COMBAT && S.fu/5 > Math.random()*100){
    log('（福缘引动，似有缘法在侧……）','sys');
    const luck = S.yun>=80?2:1;
    if(luck>1){ if(Math.random()<0.4) epicFortune(); else bigFortune(); }
    else smallFortune();
  }
  // 道侣好感自然衰减（未结道侣时久不联络则情淡，降至0自动分手；已婚则情比金坚）
  // V1.9 多线伴侣：好感随并行攻略人数加速衰减；并行≥2 概率惹争风吃醋
  if(!COMBAT){
    const purs = S.companions.filter(c=>!c.married);
    const n = purs.length;
    if(n>0){
      const decay = shichen*0.25*(1 + 0.4*(n-1));   // 线越多，衰减越快
      for(let i=purs.length-1;i>=0;i--){
        const c=purs[i];
        c.fav = Math.max(0, c.fav - decay);
        if(c.fav<=0){ const nm=c.name; const idx=S.companions.indexOf(c); if(idx>=0) S.companions.splice(idx,1); log('💔 你久未与【'+nm+'】联络，情分渐淡，终相忘于江湖。','sys'); }
      }
      if(n>=2 && Math.random() < (n-1)*0.10) S.jealousy = pick(purs).name;   // 多线生妒
    }
  }
  // 灵宠饱食度（饱则忠诚稳、战力足；饥则忠诚降；久饿不食则饿死）
  if(!COMBAT && S.pets && S.pets.length){
    for(let i=S.pets.length-1;i>=0;i--){
      const p=S.pets[i];
      p.full = clamp((p.full==null?80:p.full) - shichen*0.25, 0, 100);
      if(p.full<=20) p.loyalty = clamp(p.loyalty - shichen*0.3, 0, 100);
      if(p.full<=0 && Math.random() < 0.5*shichen){ log('🐾 灵宠【'+p.name+'】饥馁难挨，竟是饿殍于笼中……','bad'); S.pets.splice(i,1); }
    }
  }
  renderTop();
}

let MARKET = {mult:1, trend:'平稳'};   // 行情倍率：影响买卖价，每日浮动
function marketRefresh(){
  const r = 0.7 + Math.random()*0.8;          // 0.7~1.5
  MARKET.mult = Math.round(r*100)/100;
  MARKET.trend = r>1.2 ? '旺市（万物价高，宜卖不宜买）' : r<0.9 ? '淡市（万物价低，宜买不宜卖）' : '平稳';
}
// 闭关/岁月流逝：成年后随年长岁；寿元耗尽则坐化。返回 true 表示已坐化
function passYears(n){
  S.year += n;
  if(S.age>=ADULT_AGE) S.age += Math.max(1, Math.ceil(n*(1+S.ri*0.12)));  // V1.6：境界越高，闭关岁月越催人老
  S.weather = (S.loc==='mojie')?'魔煞弥漫':(S.loc==='yaojie')?'灵雾缭绕':pick(WEATHERS);
  S.status = S.status.filter(s=>{ if(s.turns!==undefined){ s.turns-=n; return s.turns>0; } return true; });
  if(S.age > REALMS[Math.min(S.ri,8)].shou){
    log('⏳ 你寿元已尽（'+REALMS[Math.min(S.ri,8)].shou+'载），油尽灯枯，于静室中坐化而去。','bad');
    endLife('寿元已尽，坐化'); return true;
  }
  return false;
}

function gongLv(g){ return (S.gongLv&&S.gongLv[g])||1; }
function learnGong(name){
  if(!S.wp) S.wp=[]; if(!S.gongLv) S.gongLv={};
  if(S.wp.includes(name)) return false;
  S.wp.push(name); S.gongLv[name]=1;
  log('📜 你于机缘中习得新功法【'+name+'】！可于「修炼 → 易修换功」设为主修。','good');
  return true;
}
function doCultivate(){
  const list=[
    {t:'运功吐纳（提升修为进度）',act:cultBreathe},
    {t:'参悟主修功法「'+(S.mainGong||'无')+'」（当前Lv'+gongLv(S.mainGong)+'，可至Lv'+gongMaxLv(S.mainGong)+'）',act:cultComprehend},
  ];
  if(S.wp && S.wp.length>1) list.push({t:'易修换功（切换主修功法）',act:cultSwitch});
  list.push({t:'返回',act:defaultChoices});
  setChoices(list);
}
function cultBreathe(){
  if(S.EN<10){ log('体力不足以支撑打坐，先进食或休息。','bad'); return defaultChoices(); }
  const g=GONGS[S.mainGong];
  const ling=(g&&g.attr==='灵')?(1+0.05*gongLv(S.mainGong)):1;
  const elemMul=(g&&g.elem===S.root)?1.1:1;   // V1.8：主修功法属性与灵根同属，修炼更速
  const gain=(1.5 + S.wu/40 + (S.rootq==='天灵根'?1:0)) * rnd(3,6) * ling * elemMul;
  S.prog=clamp(S.prog+gain,0,100);
  S.EN-=8; S.MP=clamp(S.MP+Math.round(S.maxMP*0.05*(g&&g.attr==='灵'?1.5:1)),0,S.maxMP);
  advanceTime(rnd(15,45));   // 修炼闭关数日
  log('你运转主修功法【'+(S.mainGong||'无')+'】盘膝参修，闭关数日，灵气如涓涓细流汇入丹田。修为进度 +'+gain.toFixed(1)+'%（当前 '+Math.round(S.prog)+'%）。','good');
  if(S.prog>=100 && S.ri<8) log('🌟 修为已圆满，可尝试【突破】境界！','ev');
  renderAll();
  if(S.prog>=100 && (S.ri<8||(S.ri===8&&S.si<3))) tryBreakPrompt(); else defaultChoices();
}
function cultComprehend(){
  if(S.EN<10){ log('心力不足，难以参悟，且去休养。','bad'); return defaultChoices(); }
  const g=S.mainGong, lv=gongLv(g);
  if(lv>=gongMaxLv(g)){ log('【'+g+'】已至'+gongMaxLv(g)+'重巅峰，再进需更高深传承。','sys'); return doCultivate(); }
  advanceTime(rnd(20,60)); S.EN-=10;
  S.gongLv[g]=lv+1;
  const gdef=GONGS[g]; let extra='';
  if(gdef&&gdef.attr==='血'){ recalcMax(); S.HP=clamp(S.HP+S.maxHP*0.1,0,S.maxHP); extra='气血上限更盛。'; }
  log('🧘 你于静室中潜心思悟【'+g+'】，一朝顿彻，功法境界升至 <b>Lv'+(lv+1)+'</b>！'+extra,'good');
  renderAll(); defaultChoices();
}
function cultSwitch(){
  if(!S.wp||S.wp.length<=1){ log('你仅通一门功法，无从更换。','sys'); return doCultivate(); }
  const list=S.wp.map(g=>{
    const a=GONGS[g]?GONGS[g].attr:'?';
    const atxt=a==='攻'?'攻伐':a==='防'?'守御':a==='灵'?'灵润':a==='血'?'炼体':'';
    return {t:'改修【'+g+'】'+(GONGS[g]?('（'+atxt+'·Lv'+gongLv(g)+'）'):''),act:()=>{ S.mainGong=g; log('你转修【'+g+'】为主修功法。','good'); doCultivate(); }};
  });
  list.push({t:'返回',act:doCultivate});
  setChoices(list);
}

function tryBreakPrompt(){
  setChoices([
    {t:'凝聚道基，尝试突破！',act:tryBreak},
    {t:'再沉淀一二，暂不突破',act:defaultChoices},
  ]);
}

function tryBreak(){
  if(S.prog<100){ log('修为未满，不可强突破，以免根基崩散。','bad'); return defaultChoices(); }
  // 渡劫期：先历四小阶，巅峰方可飞升
  if(S.ri===8){
    if(S.si<3){
      // 渡劫小阶突破，需破境丹助缘
      let rate = 0.18 + (S.gen/10)*0.03 + (S.fu/10)*0.015 + (LOCATIONS[S.loc].tier>=4?0.06:0);
      if(S.bag['破境丹']>0){ rate+=0.30; S.bag['破境丹']--; log('动用【破境丹】，渡劫小阶突破率 +30%。','good'); }
      else log('⚠ 无破境丹相助，渡劫小阶凶险万分（突破率偏低）。','sys');
      rate=clamp(rate,0.05,0.9);
      const cl=rnd(5,12)+S.si*4;
      log('你于渡劫期中凝练道果，欲破'+SUBNAME[S.si]+'之境……（闭关 '+cl+' 年）','sys');
      if(passYears(cl)) return;
      if(Math.random()<rate){
        S.si++; S.prog=0; recalcMax();
        log('⚡ 道果大成，你晋入【渡劫·'+SUBNAME[S.si]+'】！','good');
        if(S.si===3) log('🌟 你已至【渡劫·巅峰】，九重天雷在即。凝聚全部修为，方可尝试【飞升】！','ev');
        renderAll(); defaultChoices();
      } else {
        S.HP=clamp(S.HP-S.maxHP*0.4,1,S.maxHP);
        S.status.push({t:'道果崩裂',turns:4});
        log('💥 渡劫小阶突破失败！道果震荡，气血 -40%，需徐徐养复。','bad');
        renderAll(); defaultChoices();
      }
      return;
    }
    // 渡劫巅峰 -> 飞升
    let frate = 0.06 + (S.gen/10)*0.02 + (S.fu/10)*0.01 + (LOCATIONS[S.loc].tier>=4?0.05:0);
    ['渡厄丹','凝神丹'].forEach(n=>{ if(S.bag[n]>0){ frate+=0.15; S.bag[n]--; log('动用【'+n+'】，飞升率 +15%。','good'); } });
    if(S.bag['破境丹']>0){ frate+=0.10; S.bag['破境丹']--; log('动用【破境丹】，飞升根基更稳 +10%。','good'); }
    frate=clamp(frate,0.04,0.95);
    const feb=rnd(3,9);   // 飞升闭关年数
    if(passYears(feb)) return;
    if(Math.random()<frate){
      if(S.ach){ S.ach.realmMax=8; }
      log('🌟🌟 九重天雷加身，你道体无瑕，破碎虚空，飞升上界！三界自此传颂你的名号。','good');
      endLife('飞升上界');
    } else {
      S.HP=clamp(S.HP-S.maxHP*0.5, Math.round(S.maxHP*0.15), S.maxHP); // 永不直接致死，保命底限15%气血
      S.status.push({t:'天劫反噬',turns:5});
      log('⚡ 天劫无情，你虽未殒，却重伤（保命底限15%气血），道途受挫。静养可调息恢复。','bad');
      renderAll(); defaultChoices();
    }
    return;
  }
  const next=REALMS[S.ri+1];
  let rate=next.rate*0.9;   // V1.6 难度上调：基础突破率略降
  // 加成
  const breakItems=['筑基丹','凝神丹'];
  breakItems.forEach(n=>{ if(S.bag[n]>0){ rate+=ITEMS[n].val; S.bag[n]--; log('动用【'+n+'】，突破率 +'+(ITEMS[n].val*100)+'%。','good'); } });
  rate += (S.gen/10)*0.02 + (S.fu/10)*0.01;
  if(LOCATIONS[S.loc].tier>=4) rate+=0.05; // 灵地
  rate=clamp(rate,0.02,0.95);
  const roll=Math.random();
  advanceTime(rnd(3,8));
  if(roll<rate){
    const cl=rnd(2,5)+S.ri*S.ri;   // 闭关年数随目标境界递增（练气数年，渡劫上百载）
    log('你觅地闭关，潜心参悟大道……（闭关 '+cl+' 年）','sys');
    if(passYears(cl)) return;
    S.ri++; S.si=0; S.prog=0;
    const oldHP=S.maxHP, oldMP=S.maxMP, oldSH=S.maxShen;
    recalcMax();
    const dh=S.maxHP-oldHP, dm=S.maxMP-oldMP, ds=S.maxShen-oldSH;
    S.HP=clamp(S.HP+dh,0,S.maxHP); S.MP=clamp(S.MP+dm,0,S.maxMP); S.SH=clamp(S.SH+ds,0,S.maxShen);
    log('⚡ 轰！天地震动，你冲破桎梏，成功晋升【'+next.name+SUBNAME[0]+'】！（闭关 '+cl+' 年，各项上限大幅提升）','good');
    if(S.ach){ S.ach.breaks++; S.ach.realmMax=Math.max(S.ach.realmMax,S.ri); }
    if(S.ri===8) log('🌟 你已至渡劫期，须历「初/中/后/巅峰」四小阶，巅峰方可飞升。破境丹可助小阶突破。','ev');
  } else {
    const hard=Math.random()<0.6;   // V1.6 难度上调：走火概率更高
    if(hard){
      S.prog=clamp(S.prog-rnd(12,32),0,100);
      S.HP=clamp(S.HP-S.maxHP*0.55,1,S.maxHP);
      S.status.push({t:'走火入魔',turns:4});
      log('💥 突破失败！灵力逆乱，走火入魔，生命 -55%，修为倒退。','bad');
    } else {
      S.prog=clamp(S.prog-rnd(10,28),0,100);
      log('突破失败，灵气溃散，修为倒退些许，所幸根基无碍。','bad');
    }
  }
  settleOrders();   // 突破亦历岁月，结算到期寄售/委托
  renderAll(); defaultChoices();
}

function travelTo(id){
  if(S.age<ADULT_AGE){ log('你尚年幼，双亲不允你独自远行。（及冠之后即可行走三界）','sys'); return defaultChoices(); }
  if(!LOCATIONS[S.loc].neighbors.includes(id)){ log('此地从当前位置无法直接抵达。','sys'); return; }
  S.loc=id; S.EN-=rnd(4,10); advanceTime(rnd(2,4));
  renderAll(); event_arrive();
}

function explore(){
  if(S.age<ADULT_AGE) return childExplore();
  if(S.EN<5){ log('体力不支，无法远行探索。','bad'); return defaultChoices(); }
  S.EN-=rnd(4,8); advanceTime(rnd(1,4));
  const r=Math.random();
  if(r<0.36){ // 遭遇战斗
    eventPopup('⚔ 探索遇敌', '<p>你踏勘此地，忽有杀机逼近——似有修士或妖兽窥伺！</p>',
      [{t:'拔剑迎战', act:startCombat},
       {t:'暂避', act:()=>{ log('你见势不妙，隐入暗处避开。','sys'); defaultChoices(); }}]);
  } else if(r<0.64){ // 机缘
    eventPopup('🌟 探索机缘', '<p>你在山野间似有所见……</p>',
      [{t:'上前查看', act:smallFortune},
       {t:'不理，继续', act:defaultChoices}]);
  } else if(r<0.8){ // 大陆奇遇

    if(S.SH>=S.maxShen*0.5 && Math.random()<0.2){   // V1.8：神识外放，探得隐秘灵草
      const name=pick(L.herbs||['聚气草']); S.bag[name]=(S.bag[name]||0)+1; if(S.ach)S.ach.herbs++;
      log('👁 你以神识扫过山野，竟有所获——采得【'+name+'】（'+HERBS[name].pin+'品）！','good');
    }
    renderAll(); defaultChoices();
  }
}

function gather(){
  if(S.age<ADULT_AGE){ log('你年幼力弱，采药这般辛苦事还做不来，且去玩耍罢。','sys'); return defaultChoices(); }
  const L=LOCATIONS[S.loc];
  if(!L.herbs || !L.herbs.length){ log('此地灵气稀薄，寻不得什么灵草。','sys'); return defaultChoices(); }
  if(S.EN<6){ log('体力不足，采药需气力。','bad'); return defaultChoices(); }
  S.EN-=6; advanceTime(rnd(1,3));
  // 按地点 tier 决定可采品阶概率
  const name=pick(L.herbs);
  S.bag[name]=(S.bag[name]||0)+1;
  if(S.ach) S.ach.herbs++;

  log('你在山野间采得【'+name+'】（'+pin+'品灵草）！可售于坊市或留待炼丹。','good');
  // 采药时偶遇妖兽
  if(Math.random()<0.3){ log('采药间忽觉腥风扑面——有妖兽循味而来！','ev'); startCombat(); return; }
  renderAll(); defaultChoices();
}

function rest(){
  S.EN=clamp(S.EN+40,0,100); S.HP=clamp(S.HP+Math.round(S.maxHP*0.2),0,S.maxHP);
  S.MP=clamp(S.MP+Math.round(S.maxMP*0.2),0,S.maxMP);
  S.SH=clamp(S.SH+Math.round(S.maxShen*0.6),0,S.maxShen);   // V1.8：调息亦养神识
  advanceTime(rnd(4,8));
  log('你寻一处静地调息安睡，体力恢复，伤势稍愈，神识亦得滋养。','good');
  if(S.age<ADULT_AGE) ageUp(1);   // 幼年：睡一觉也长一岁
  renderAll(); defaultChoices();
}

// 比武大会：递进擂台，连胜越多赏越厚，魁首可遇佳人/悟法
function tournament(){
  if(S.EN<5){ log('倦怠，无力登台。','sys'); return defaultChoices(); }
  S.EN-=5; advanceTime(rnd(2,6));
  const opps=[];
  for(let i=0;i<3;i++){
    const eri=clamp(S.ri+rnd(-1,2),0,8);
    const eprof=pick(Object.keys(PROFS));
    const pw=S.ri*40+60+S.gen*0.3, ew=eri*40+60+PROFS[eprof].atk*20;
    const strength=clamp(Math.round((ew/(pw+ew))*100),5,95);
    opps.push({name:genName(eprof==='妖修'?'男':'女','hong'), eri, eprof, strength});
  }
  window.__arena=opps;
  const box=document.getElementById('modalBox');
  let h='<h2 class="seal">🏆 比武大会</h2><p class="small">报名者众，择一对手登台。对手境界/职业/强度各异，量力而行。</p>';
  opps.forEach((o,i)=>{ h+='<div class="shopitem"><span>【'+o.name+'】 '+REALMS[o.eri].name+SUBNAME[rnd(0,3)]+' · '+o.eprof+'　强度 '+o.strength+'%</span><button class="btn sm" onclick="arenaFight('+i+')">挑战</button></div>'; });
  h+='<div class="center" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">不比了</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
// 狩猎灵兽大赛：三档灵兽自选，珍稀者或得高阶灵草
function beastHunt(){
  if(S.EN<5){ log('倦怠，无力出猎。','sys'); return defaultChoices(); }
  S.EN-=5; advanceTime(rnd(2,6));
  const beasts=[
    {name:'赤眼灵狐', tier:1, rew:{spirit:rnd(20,50)}},
    {name:'玄铁莽',   tier:2, rew:{spirit:rnd(50,120)}},

  ];
  setChoices([

function huntResolve(b){
  const eri=clamp(S.ri+b.tier-1,0,8);
  const pw=S.ri*40+60+S.gen*0.3, ew=eri*40+80+b.tier*20;
  const p=clamp(0.55+(pw-ew)/200,0.1,0.92);
  advanceTime(rnd(1,4));
  if(Math.random()<p){
    if(b.rew.spirit){ S.spirit.下+=b.rew.spirit; log('🐾 你猎得【'+b.name+'】，剥得灵材，售得下品灵石 '+b.rew.spirit+'。','good'); }
    else { S.bag[b.rew.herb]=(S.bag[b.rew.herb]||0)+1; log('🐾 你猎得【'+b.name+'】，其巢中藏有【'+b.rew.herb+'】！','good'); }
    S.fame+=b.tier*2; if(S.ach)S.ach.hunt++;
    if(b.rew.herb && (!S.pets||S.pets.length<4) && Math.random()<0.5){
      eventPopup('🐾 降服灵兽', '<p>【'+b.name+'】虽败不馁，似有灵性，愿认你为主。</p>',
        [{t:'收为灵宠', act:()=>{ addPet(b.name); defaultChoices(); }},
         {t:'只取其材', act:defaultChoices}]);
      return;
    }
  } else {
    S.HP=clamp(S.HP-S.maxHP*0.35,1,S.maxHP);
    log('💢 你与【'+b.name+'】缠斗不敌，负伤而退（气血-35%）。','bad');
    if(S.HP<=0) return loseCombat();
  }
  renderAll(); defaultChoices();
}

/* ===================== 战斗 ===================== */
let COMBAT=null;
function startCombat(){
  if(S.age<ADULT_AGE){ log('你尚年幼，遇事自有长辈护持，未曾卷入争斗。','sys'); return defaultChoices(); }
  const L=LOCATIONS[S.loc];
  const type = (L.type==='mo')?'mo':(L.type==='yao')?'yao':(L.type==='danger')?'danger':(L.type==='neutral')?'neutral':'human';
  const name=pick(ENEMY_NAMES[type]);
  // 敌人境界：随地点 tier
  let eri = clamp(S.ri + rnd(-1,1) + Math.floor((L.tier-2)/1.5), 0, 8);
  const eprof = (type==='mo')?'魔修':(type==='yao')?'妖修':pick(['剑修','法修','体修','符修']);
  const est=REALMS[eri];
  const tierScale = 1 + (L.tier-2)*0.06;   // 凶地强者更盛
  const ehp=Math.round(est.hp*SUB[rnd(0,3)]*(0.6+Math.random()*0.45)*tierScale);
  COMBAT={ name, ri:eri, prof:eprof, HP:ehp, maxHP:ehp,
    defPow:(eri*20+30)*PROFS[eprof].def*(0.8+Math.random()*0.4)*tierScale,
    atkPow:(eri*40+50)*PROFS[eprof].atk*(0.8+Math.random()*0.4)*tierScale,
    turn:0, defend:false, eDefend:false, eCharge:false, charge:false, youDefBuff:1, petUsed:false };
  log('⚔ 遭遇【'+name+'】（'+REALMS[eri].name+'·'+eprof+'）！一场恶战在所难免。','ev');
  const _mc1=primaryCompanion(); if(_mc1) log('💞 道侣【'+_mc1.name+'】为你掠阵助威。','sys');
  if(S.pets&&S.pets.length) log('🐾 灵宠【'+S.pets[0].name+'】随你出战，可召之助战。','sys');
  combatChoices();
}

function combatPAtk(){
  let pAtk=(S.ri*40+60+SUB[S.si]*15)*PROFS[S.prof].atk;
  const g=GONGS[S.mainGong];
  if(g){ const lv=gongLv(S.mainGong);
    if(g.attr==='攻') pAtk*=(1+0.06*lv);
    else if(g.attr==='血') pAtk*=(1+0.025*lv);
  }
  if(S.weapon) pAtk+=weaponAtk(S.weapon);
  return pAtk;
}
function combatPDef(){
  let pDef=(S.ri*20+20)*PROFS[S.prof].def;
  if(S.armor) pDef+=armorDef(S.armor);
  return pDef;
}
function combatEnemyTurn(){
  if(!COMBAT) return;
  if(COMBAT.eDefend) COMBAT.eDefend=false;
  const eact=Math.random(); let em=1;
  if(eact<0.18){ COMBAT.eDefend=true; log(COMBAT.name+'凝势防守。','sys'); }
  else if(eact<0.30){ COMBAT.eCharge=!COMBAT.eCharge; log(COMBAT.name+(COMBAT.eCharge?'周身煞气翻涌，似在蓄力……':'收束煞气。'),'sys'); }
  else {
    if(COMBAT.eCharge){ em=1.5; COMBAT.eCharge=false; log(COMBAT.name+'蓄力爆发！','bad'); }
    let edmg=Math.round(COMBAT.atkPow*em - combatPDef()*0.6*(COMBAT.youDefBuff||1));
    if(KEKE[COMBAT.prof]===S.prof) edmg=Math.round(edmg*1.25);
    if(COMBAT.defend) edmg=Math.round(edmg*0.4);
    edmg=Math.max(1,edmg);
    S.HP-=edmg;
    log(COMBAT.name+'反扑，你受 '+edmg+' 点伤害。'+(S.HP< S.maxHP*0.3?'（气血危急！）':''),'bad');
  }
  COMBAT.defend=false;
}
// 全力连击：自动战斗快速决胜，省去反复点击磨血（V1.7）
function combatAuto(){
  if(!COMBAT) return;
  log('⚡ 你展开【全力连击】，自动迎敌！','ev');
  let guard=0;
  while(COMBAT && COMBAT.HP>0 && S.HP>0 && guard<300){
    guard++; COMBAT.turn++;
    const g=GONGS[S.mainGong];
    let pAtk=combatPAtk();
    let mult=2.0, usedSkill=false, skName='全力一击';
    let mp=g&&g.skill?Math.round(g.skill.mp*(1+S.ri*0.6)):0;
    if(g && S.MP>=mp){ mult=g.skill.mult; S.MP-=mp; usedSkill=true; skName=g.skill.name; }
    if(COMBAT.charge){ mult*=1.6; COMBAT.charge=false; }
    let dmg=Math.round(pAtk*mult - COMBAT.defPow*0.6);
    if(KEKE[S.prof]===COMBAT.prof) dmg=Math.round(dmg*1.25);
    if(usedSkill) dmg=Math.round(dmg*gongSchoolBonus(g.name));
    if(S.fu>=65 && Math.random()<S.fu/260){ dmg=Math.round(dmg*1.8); }
    if(S.gen>=80 && Math.random()<0.06){ dmg=Math.round(dmg*1.15); }
    dmg=Math.max(1,dmg);
    COMBAT.HP-=dmg;
    if(COMBAT.HP<=0) break;
    combatEnemyTurn();
    if(S.HP<=0) break;
  }
  if(COMBAT && COMBAT.HP<=0){ return winCombat(); }
  if(S.HP<=0){ return loseCombat(); }
  advanceTime(1); renderAll(); combatChoices();
}

function combatChoices(){
  if(!COMBAT) return;
  const g=GONGS[S.mainGong];

  log('　你的攻伐受主修【'+(S.mainGong||'无')+'·Lv'+gongLv(S.mainGong)+'（'+(g?({攻:'攻伐+'+bonus,防:'守御',灵:'灵润',血:'炼体+'+bonus}[g.attr]):'')+sch+'）】加持。','sys');
  const list=[

    {t:'⚡ 全力连击（自动战斗，快速决胜）',act:combatAuto},

function combatSkillMenu(){
  if(!COMBAT) return;
  const pAtk=combatPAtk();
  const list=(S.wp||[]).map(g=>{ const gg=GONGS[g]; const sk=gg?gg.skill:PROFS[S.prof].skill;
    const atxt=gg?({攻:'攻伐',防:'守御',灵:'灵润',血:'炼体'}[gg.attr]):'本职';
    const cost=Math.round(sk.mp*(1+S.ri*0.6));
    const sb=gg?gongSchoolBonus(g):1;
    const est=Math.max(1,Math.round(pAtk*sk.mult - COMBAT.defPow*0.6)*(KEKE[S.prof]===COMBAT.prof?1.25:1)*sb);
    const tierTxt=gg&&gg.tier==='传承'?'·传承':'';
    const schTxt=sb>1?'·流派+'+Math.round((sb-1)*100)+'%':(sb<1?'·相悖-'+Math.round((1-sb)*100)+'%':'');
    return {t:'【'+g+'】('+atxt+tierTxt+'·Lv'+gongLv(g)+')　估计伤'+est+'·耗灵'+cost+schTxt, act:()=>combatAction('skill', g)};
  });
  list.push({t:'返回', act:combatChoices});
  setChoices(list);

function combatAction(act, gong){
  if(!COMBAT) return;
  COMBAT.turn++;
  const g=GONGS[S.mainGong];
  let pAtk=combatPAtk();
  let pDef=combatPDef();
  const youDefMult = COMBAT.youDefBuff||1;

  // 玩家行动
  if(act==='flee'){
    const sk=S.bag['遁地符']>0;
    if(sk){ S.bag['遁地符']--; log('你捏碎【遁地符】，金光一闪，瞬息脱身。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    const chance=0.3 + (S.ri-COMBAT.ri)*0.1 + (g&&g.attr==='灵'?0.05:0);
    if(Math.random()<chance){ log('你身法如电，撤出战圈，全身而退。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    log('逃跑失败！破绽大露。','bad');
  } else if(act==='defend'){
    COMBAT.defend=true; log('你凝神聚气，守势如铁壁。','sys');
  } else if(act==='pet'){
    COMBAT.petUsed=true;
    const np = Math.min(S.pets.length, 1 + Math.floor(((S.SH||0)/(S.maxShen||1))*2));   // V1.8：神识越高，可同时号令灵宠越多（1~3）
    let total=0; const parts=[];
    for(let pi=0; pi<np; pi++){
      const p=S.pets[pi]; if(!p) break;
      const sk=PET_SKILLS[p.beast]||{name:'撕咬',mult:1.5};
      const hungry=(p.full||100)<30; const hungerMul=hungry?0.5:1;
      const d=Math.round((12+p.lv*18+(p.equip.武器?weaponAtk(p.equip.武器):0))*sk.mult*(0.85+Math.random()*0.3)*hungerMul);
      total+=d; parts.push(p.name+'【'+sk.name+'】'+d+(hungry?'（饥减半）':''));
    }
    COMBAT.HP-=total; log('🐾 你号令 '+np+' 只灵宠助战，共造成 '+total+' 伤！（'+parts.join('、')+'）','good');
  } else if(act==='charge'){
    COMBAT.charge=!COMBAT.charge;
    log(COMBAT.charge?'你沉腰坐马，灵力汇聚于兵刃，蓄势待发（下回合攻击×1.6）。':'你散去蓄力，回归常态。','sys');
  } else {
    COMBAT.defend=false;
    let mult=1, mp=0;
    if(act==='skill'){ const sk = gong? GONGS[gong].skill : (g?g.skill:PROFS[S.prof].skill); mult=sk.mult; mp=Math.round(sk.mp*(1+S.ri*0.6));   // 灵力消耗随境界递增，后期不可随意放技
      if(S.MP<mp){ log('灵力不足（需 '+mp+'），绝技难以施展，只得强行为之！','bad'); S.HP=clamp(S.HP-S.maxHP*0.05,1,S.maxHP); }
      else S.MP-=mp;
    }
    if(COMBAT.charge){ mult*=1.6; COMBAT.charge=false; log('✦ 蓄力一击！','good'); }
    let dmg=Math.round(pAtk*mult - COMBAT.defPow*0.6);
    if(KEKE[S.prof]===COMBAT.prof) dmg=Math.round(dmg*1.25);   // 职业克制
    if(act==='skill') dmg=Math.round(dmg*gongSchoolBonus(gong||S.mainGong));   // 流派相合伤害增益
    if(act==='skill') dmg=Math.round(dmg*gongElemBonus(gong||S.mainGong));     // V1.8：五行相合/相生增益
    if(S.fu>=65 && Math.random()<S.fu/260){ dmg=Math.round(dmg*1.8); log('✦ 福缘暴击！','good'); }  // 暴击
    if(S.gen>=80 && Math.random()<0.06){ dmg=Math.round(dmg*1.15); log('✦ 身法如鬼，破绽尽显！','good'); }  // 身法破绽
    if(S.SH>=S.maxShen*0.7 && Math.random()<0.07){ dmg=Math.round(dmg*1.12); log('👁 神识识破，一击中的！','good'); }  // V1.8：神识识破
    dmg=Math.max(1,dmg);
    COMBAT.HP-=dmg;
    const skName = (act==='skill') ? ((gong?GONGS[gong].skill.name:(g?g.skill.name:'御剑斩'))) : null;
    log('你'+(skName?'施展【'+skName+'】':'挥击')+'，重创'+COMBAT.name+'，造成 '+dmg+' 点伤害。','good');
    if(S.bag['火符']>0 && Math.random()<0.25){ S.bag['火符']--; COMBAT.HP-=200; log('顺势甩出【火符】，再添 200 伤！','good'); }
  }
  if(COMBAT && COMBAT.HP<=0){ return winCombat(); }

  // 敌方行动（AI：攻 / 防 / 蓄力）
  if(COMBAT){ combatEnemyTurn(); }
  // 道侣掠阵：已婚道侣偶助你疗伤输气
  const _mc2=primaryCompanion(); if(_mc2&&COMBAT&&Math.random()<0.2){ const hh=Math.round(S.maxHP*0.03); S.HP=clamp(S.HP+hh,0,S.maxHP); log('💞 道侣'+_mc2.name+'为你輸氣，气血 +'+hh+'。','good'); }
  advanceTime(1); renderAll();
  if(S.HP<=0) return loseCombat();
  combatChoices();
}
function combatItemMenu(){
  if(!COMBAT) return;
  const usable=Object.keys(S.bag).filter(k=>S.bag[k]>0 && ITEMS[k] && (ITEMS[k].cat==='丹药'||ITEMS[k].cat==='符箓'));
  if(!usable.length){ log('行囊中无可用丹药符箓。','sys'); return combatChoices(); }
  const list=usable.map(k=>{ const it=ITEMS[k];
    const lbl = it.cat==='丹药' ? (it.type==='hp'?'疗伤':it.type==='mp'?'回灵':it.type==='full'?'回元':it.type==='cure'?'解厄':it.type==='break'?'突破':'')
                                : (it.type==='atk'?'伤敌':it.type==='def'?'护体':it.type==='flee'?'脱战':'');
    return {t:'用【'+k+'】('+lbl+')', act:()=>combatUseItem(k)};
  });
  list.push({t:'返回战斗', act:combatChoices});

function combatUseItem(key){
  if(!COMBAT) return;
  if(!S.bag[key]||S.bag[key]<=0){ log('该物已用完。','sys'); return combatChoices(); }
  const it=ITEMS[key];
  if(it.cat==='丹药'){
    if(it.type==='hp') S.HP=clamp(S.HP+it.val,0,S.maxHP);
    else if(it.type==='mp') S.MP=clamp(S.MP+it.val,0,S.maxMP);
    else if(it.type==='full'){ S.HP=clamp(S.HP+S.maxHP*it.val,0,S.maxHP); S.MP=clamp(S.MP+S.maxMP*it.val,0,S.maxMP); }
    else if(it.type==='cure') S.status=S.status.filter(s=>s.t!==it.val);
    else if(it.type==='break'){ log('【'+key+'】须在突破时使用。','sys'); return combatChoices(); }
    S.bag[key]--; log('你服下【'+key+'】，'+it.desc+'。','good');
  } else if(it.cat==='符箓'){
    if(it.type==='flee'){ S.bag[key]--; log('你捏碎【'+key+'】，金光一闪，瞬息脱身。','good'); COMBAT=null; advanceTime(1); renderAll(); return defaultChoices(); }
    if(it.type==='def'){ if(!COMBAT.youDefBuff) COMBAT.youDefBuff=1; COMBAT.youDefBuff*=it.val; S.bag[key]--; log('你祭出【'+key+'】，本场减伤！','good'); }
    if(it.type==='atk'){ S.bag[key]--; COMBAT.HP-=it.val; log('甩出【'+key+'】，伤敌 '+it.val+'！','good'); if(COMBAT.HP<=0){ renderAll(); return winCombat(); } }
  }
  // 用物后敌方行动
  if(COMBAT){
    if(COMBAT.eDefend) COMBAT.eDefend=false;
    const eact=Math.random(); let em=1;
    if(eact<0.18){ COMBAT.eDefend=true; log(COMBAT.name+'趁你调息，凝势防守。','sys'); }
    else {
      if(COMBAT.eCharge){ em=1.5; COMBAT.eCharge=false; log(COMBAT.name+'蓄力爆发！','bad'); }
      let edmg=Math.round(COMBAT.atkPow*em - ((S.ri*20+20)*PROFS[S.prof].def+(S.armor?armorDef(S.armor):0))*0.6*(COMBAT.youDefBuff||1));
      if(KEKE[COMBAT.prof]===S.prof) edmg=Math.round(edmg*1.25);
      edmg=Math.max(1,edmg);
      S.HP-=edmg; log(COMBAT.name+'趁机反扑，你受 '+edmg+' 伤。'+(S.HP<S.maxHP*0.3?'（气血危急！）':''),'bad');
    }
    COMBAT.defend=false;
  }
  advanceTime(1); renderAll();
  if(S.HP<=0) return loseCombat();
  combatChoices();
}
function winCombat(){
  if(COMBAT && COMBAT.onWin){ const cb=COMBAT.onWin; COMBAT=null; advanceTime(1); renderAll(); cb(); return; }   // V1.9：伴侣对战等非致命结算
  const exp = (COMBAT.ri+1)*rnd(8,16);
  S.prog=clamp(S.prog+exp/3,0,100);
  const L=LOCATIONS[S.loc]; const tierL=(L.tier||2);
  const base = COMBAT.ri>=2 ? (COMBAT.ri+1)*rnd(35,70) : rnd(20,50);
  const drop = Math.round(base*(1+(tierL-2)*0.15));
  S.spirit.下+=drop;
  S.fame+=Math.max(1,COMBAT.ri+1);
  let txt='⚔ 你斩杀【'+COMBAT.name+'】（'+REALMS[COMBAT.ri].name+'），修为精进，得下品灵石 '+drop+' 枚，声望 +'+(COMBAT.ri+1)+'。';
  if(COMBAT.ri>=4){ const mid=rnd(2,8)+(COMBAT.ri-3); S.spirit.中+=mid; txt+=' 另获中品灵石 '+mid+'！'; }
  if(COMBAT.ri>=6){ const up=rnd(1,4); S.spirit.上+=up; txt+=' 另获上品灵石 '+up+'！'; }
  if(COMBAT.ri>=8 && Math.random()<0.5){ const top=rnd(1,2); S.spirit.极+=top; txt+=' 更得极品灵石 '+top+' 枚！'; }
  if(Math.random()<0.4){ const g=rnd(5,30); S.gold+=g; txt+=' 又得金银 '+g+' 两。'; }
  if(COMBAT.ri>=3 && Math.random()<0.35){
    const lootPool=Object.keys(ITEMS).filter(k=>ITEMS[k].slot && (ITEMS[k].tier||1)<=tierL && !ITEMS[k].high);
    if(lootPool.length){ const k=pick(lootPool); S.bag[k]=(S.bag[k]||0)+1; txt+=' 拾得【'+k+'】！'; }
  } else if(Math.random()<0.25){
    const k=pick(LOCATIONS[S.loc].herbs||['聚气草']); S.bag[k]=(S.bag[k]||0)+1; txt+=' 顺手采得【'+k+'】。';
  }
  log(txt,'good');
  if(S.ach){ S.ach.slain++; S.ach.realmMax=Math.max(S.ach.realmMax,S.ri); }
  COMBAT=null; advanceTime(rnd(1,2)); renderAll();
  if(Math.random()<0.22){ meetOtherRace(); return; }
  if(S.prog>=100 && (S.ri<8||(S.ri===8&&S.si<3))) tryBreakPrompt(); else defaultChoices();
}

function endLife(reason){
  const e = saveRecall(reason);
  log('📜 一世终结，已存入「回忆录」。','good');
  if(e.heir) log('❖ 你留有后裔【'+e.heirName+'】，可在开局时选择「继承」，延续血脉。','ev');
  COMBAT=null;
  if(reason==='飞升上界'){ showAscend(e); return; }
  setChoices([{t:'翻阅回忆录',act:openRecall},{t:'重开此世',act:()=>location.reload()}]);
}

function saveRecall(reason){
  const recall = loadRecall();
  let highlights=[];
  try{
    const lines = (logEl && logEl.querySelectorAll) ? logEl.querySelectorAll('.line') : [];
    for(let i=lines.length-1; i>=0 && highlights.length<8; i--){
      const t=lines[i].textContent, c=(lines[i].className||'');
      if(c.indexOf('good')>=0 || c.indexOf('ev')>=0) highlights.unshift('· '+t);
    }
  }catch(_){}
  const rm = (S.ach?S.ach.realmMax:0);
  const e={
    id: recall.length,
    name:S.name, sex:S.sex, age:S.age, origin:S.origin, root:S.root, rootq:S.rootq, prof:S.prof,
    realmMax: rm, realmName: REALMS[rm].name+SUBNAME[0],
    ach: S.ach?JSON.parse(JSON.stringify(S.ach)):{},
    end: reason, heir: (S.后代&&S.后代.length>0),
    heirName: (S.后代&&S.后代.length>0)?S.后代[S.后代.length-1].name:null,
    heirs: (S.后代||[]).map(c=>({name:c.name, sex:c.sex||'男', root:c.root||S.root, rootq:c.rootq||S.rootq, inheritGong:c.inheritGong})),
    inherit: (function(){ const heirGongs=(S.后代||[]).filter(c=>c.inheritGong).map(c=>c.inheritGong); return { spirit:(S.inheritHeir!=null?Math.floor(S.spirit.下):Math.floor(S.spirit.下/2)), weapon:S.weapon, armor:S.armor, wp:(S.wp||[]).slice().concat(heirGongs), gold:Math.floor(S.gold/2) }; })(),
    fame: S.fame, gold: S.gold, inherits: (S.inherit||0),
    victory: (reason==='飞升上界'),
    highlights, time: S.year+'年'
  };
  recall.push(e);
  try{ localStorage.setItem(RECALL_KEY, JSON.stringify(recall)); }catch(_){}
  return e;
}

function weaponAtk(n){ return ITEMS[n]?ITEMS[n].atk:30; }
function armorDef(n){ return ITEMS[n]?ITEMS[n].def:20; }

/* ===================== 物品使用 ===================== */
function useItemByName(name){
  // 别名容错（如「破镜丹」→「破境丹」，镜/境同音异字）
  const norm = name.replace(/镜/g,'境');
  let real = ITEM_ALIAS[name] || ITEM_ALIAS[norm] || null;
  if(real && S.bag[real]>0){ return useItem(real); }
  // 在背包里模糊匹配
  let key=null;
  for(const k in S.bag){ if(S.bag[k]>0 && (k.includes(name)||name.includes(k)||k.includes(norm))){ key=k; break; } }
  if(!key){ log('行囊中并无此物。','sys'); return; }
  useItem(key);
}
function useItem(key){
  if(!S.bag[key]||S.bag[key]<=0){ log('该物已用完。','sys'); return; }
  const it=ITEMS[key];
  if(!it){ // 灵草类：可直接服用疗养，亦可喂灵宠
    if(HERBS[key]){
      eventPopup('🌿 灵草', '<p>【'+key+'】为'+HERBS[key].pin+'品灵草。可直接服用以疗养气血灵力，或喂予灵宠增进修为。</p>', [
        {t:'自行服用（按品阶恢复少量气血/灵力）', act:()=>{ if(!S.bag[key]) return defaultChoices(); S.bag[key]--; const r=HERBS[key].pin; S.HP=clamp(S.HP+Math.round(S.maxHP*0.04*r),0,S.maxHP); S.MP=clamp(S.MP+Math.round(S.maxMP*0.04*r),0,S.maxMP); log('你嚼服【'+key+'】，气血灵力稍复。','good'); advanceTime(1); renderAll(); defaultChoices(); }},
        {t:'喂予灵宠', act:()=>{ if(S.pets&&S.pets.length){ const p=S.pets[0]; S.bag[key]--; p.exp+=HERBS[key].pin*8; p.loyalty=clamp(p.loyalty+HERBS[key].pin*3,0,100); p.full=clamp((p.full||0)+HERBS[key].pin*12,0,100); log('你以【'+key+'】喂养'+p.name+'，经验 +'+(HERBS[key].pin*8)+'、忠诚 +'+(HERBS[key].pin*3)+'、饱食 +'+(HERBS[key].pin*12)+'。','good'); advanceTime(1); renderAll(); defaultChoices(); } else { log('你尚无灵宠可喂，留着待用。','sys'); defaultChoices(); } }},
        {t:'留着（售出/炼丹）', act:defaultChoices},
      ]);
      return;
    }
    log('【'+key+'】为灵草材料，可于坊市售出，或留待炼丹。','sys'); return;
  }
  if(it.cat==='丹药'){
    if(it.type==='hp'){ S.HP=clamp(S.HP+it.val,0,S.maxHP); }
    else if(it.type==='mp'){ S.MP=clamp(S.MP+it.val,0,S.maxMP); }
    else if(it.type==='full'){ S.HP=clamp(S.HP+S.maxHP*it.val,0,S.maxHP); S.MP=clamp(S.MP+S.maxMP*it.val,0,S.maxMP); }
    else if(it.type==='cure'){ S.status=S.status.filter(s=>s.t!==it.val); }
    else if(it.type==='break'){ log('【'+key+'】须在突破时使用，当前已收入囊中。','sys'); return; }
    S.bag[key]--; log('你服下【'+key+'】，'+it.desc+'。','good');
  } else if(it.cat==='符箓'){
    if(it.type==='flee'){ log('【'+key+'】须在战斗中使用。','sys'); return; }
    if(it.type==='def'){ if(COMBAT){ COMBAT.youDefBuff=(COMBAT.youDefBuff||1)*it.val; } log('【'+key+'】须在战斗中使用。','sys'); return; }
    if(it.type==='atk'){ if(COMBAT){ COMBAT.HP-=it.val; S.bag[key]--; log('甩出【'+key+'】，伤敌 '+it.val+'！','good'); if(COMBAT.HP<=0) return winCombat(); } else log('【'+key+'】须在战斗中使用。','sys'); return; }
  }
  if(it.cat==='礼物'){ giftItem(key); return; }
  if(it.cat==='武器'||it.cat==='防具'||it.cat==='饰品'){
    const slot=it.slot;
    if(slot==='武器'){ if(S.weapon&&ITEMS[S.weapon]) S.bag[S.weapon]=(S.bag[S.weapon]||0)+1; S.weapon=key; }
    else if(slot==='防具'){ if(S.armor&&ITEMS[S.armor]) S.bag[S.armor]=(S.bag[S.armor]||0)+1; S.armor=key; }
    else if(slot==='饰品'){ if(S.ring&&ITEMS[S.ring]) S.bag[S.ring]=(S.bag[S.ring]||0)+1; S.ring=key; }
    S.bag[key]--; log('你装备【'+key+'】。','good'); advanceTime(1); renderAll(); openBag(); return;
  }
  advanceTime(1); renderAll(); defaultChoices();
}

/* ===================== 坊市（按城等阶限售 + 行情 + 多币种） ===================== */
// 按城市等阶限售：低阶城只卖寻常器物，高阶城方出灵器法宝；高品丹药不入市，唯丹房可炼
function baseStock(tier){
  const out=[];
  for(const k in ITEMS){
    const it=ITEMS[k];
    if(it.high) continue;                 // 高品丹药不入寻常坊市
    const t=it.tier||1;
    if(t<=tier) out.push(k);
  }
  return out;
}
// 抵达新地时刷新本地货品（并偶现跨阶「奇货」，制造上架/刷新感）
function refreshLocalShop(){
  const L=LOCATIONS[S.loc]; const tier=L.tier||2;
  S.shopStock=baseStock(tier);
  S.shopSpecial=null;
  if(Math.random()<0.5){
    const pool=Object.keys(ITEMS).filter(k=>{ const it=ITEMS[k]; return !it.high && (it.tier||1)>tier && it.cat!=='礼物'; });
    if(pool.length) S.shopSpecial=pick(pool);
  }
}
// 商品价目：低阶用下品灵石；中阶（tier3）耗中品+下品；高阶（tier4）耗上品灵石并贴金银；
// 极品（tier5）耗极品灵石；礼物为凡间珍玩，以金银购（还金银以用武之地）
function itemCost(k){
  const it=ITEMS[k]; const t=it.tier||1;
  if(it.cat==='礼物') return {gold: Math.round(it.price*MARKET.mult)};
  if(t<=2) return {下: Math.round(it.price*MARKET.mult)};
  if(t===3) return {中: Math.max(1,Math.round(it.price/30)), 下: (it.price%30)};
  if(t===4) return {上: Math.max(1,Math.round(it.price/150)), gold: Math.round(it.price*0.05)};
  return {极: Math.max(1,Math.round(it.price/600))};
}
function costText(c){ return Object.keys(c).map(k=> c[k]+(k==='gold'?'金':k+'品灵石')).join(' + '); }
function canPay(c){ for(const k in c){ const have=k==='gold'?S.gold:S.spirit[k]; if(have< c[k]) return false; } return true; }
function doPay(c){ for(const k in c){ if(k==='gold') S.gold-=c[k]; else S.spirit[k]-=c[k]; } }
function shopTrade(){
  let h='<div class="mtip">—— 收购（你卖，价随行情） ——</div>';
  const sellList=Object.keys(S.bag).filter(k=>S.bag[k]>0 && HERBS[k]);
  if(sellList.length) sellList.forEach(k=>{ const price=Math.round(HERBS[k].price*MARKET.mult);
    h+='<div class="shopitem"><span>'+k+'（'+HERBS[k].pin+'品）×'+S.bag[k]+'　售价 '+price+' 下品灵石</span><button class="btn sm" onclick="sellHerb(\''+k+'\')">卖1</button></div>'; });
  else h+='<div class="small">（无灵草可卖）</div>';
  h+='<div class="mtip">—— 出售（你买，价随城等阶与行情） ——</div>';
  if(LOCATIONS[S.loc].shop){
    const stock = S.shopStock || baseStock(LOCATIONS[S.loc].tier||2);
    if(!stock.length) h+='<div class="small">（此间商铺寻常器物，无甚稀奇）</div>';
    stock.forEach(k=>{ const it=ITEMS[k]; const cost=itemCost(k);
      h+='<div class="shopitem"><span>'+k+'　'+costText(cost)+'　<span class="small">'+it.desc+'</span></span><button class="btn sm" onclick="buyItem(\''+k+'\')">买</button></div>'; });
    if(S.shopSpecial){ const k=S.shopSpecial; const it=ITEMS[k]; const cost=itemCost(k);
      h+='<div class="shopitem"><span>🎁 奇货·'+k+'　'+costText(cost)+'　<span class="small">'+it.desc+'（限时奇遇，价高）</span></span><button class="btn sm" onclick="buyItem(\''+k+'\')">买</button></div>'; }
  } else h+='<div class="small">（此处无正规商铺，唯黑市可交易）</div>';
  return h;
}
function shopRefine(){ return refineHTML(); }
function shopAuction(){
  let h='<div class="mtip">—— 寄售（闭关数年后高价售出，1.3~2.2倍） ——</div>';
  const items=Object.keys(S.bag).filter(k=>S.bag[k]>0);
  if(items.length) items.forEach(k=>{ const base=HERBS[k]?HERBS[k].price:(ITEMS[k]?ITEMS[k].price:5);
    h+='<div class="shopitem"><span>'+k+'×'+S.bag[k]+'（约 '+Math.round(base*1.5)+'+ 下灵石）</span><button class="btn sm" onclick="consignItem(\''+k+'\')">寄售1</button></div>'; });
  else h+='<div class="small">（行囊空空）</div>';
  h+='<div class="mtip">—— 寄售中 ——</div>';
  let n=0; if(S.orders) S.orders.forEach(o=>{ if(o.type==='sell'){ h+='<div class="small">'+o.name+'　约 '+o.year+' 年售出</div>'; n++; } });
  if(!n) h+='<div class="small">（暂无）</div>';
  return h;
}
function shopBarter(){
  let h='<div class="small">以物易物：交出一物，换得随机天材地宝或法器（盈亏看运气）。</div>';
  const items=Object.keys(S.bag).filter(k=>S.bag[k]>0);
  if(items.length) items.forEach(k=>{ h+='<div class="shopitem"><span>'+k+'×'+S.bag[k]+'</span><button class="btn sm" onclick="barterItem(\''+k+'\')">易物</button></div>'; });
  else h+='<div class="small">（行囊空空）</div>';
  return h;
}
function shopCommission(){
  let h='<div class="small">委托商队代寻灵草，付定金，数日后到货（价随行情）。</div>';
  for(const n in HERBS){ const price=Math.round(HERBS[n].price*1.4)+5;
    h+='<div class="shopitem"><span>'+n+'（'+HERBS[n].pin+'品）定金 '+price+'</span><button class="btn sm" onclick="commissionHerb(\''+n+'\')">委托</button></div>'; }
  h+='<div class="mtip">—— 委托中 ——</div>';
  let n=0; if(S.orders) S.orders.forEach(o=>{ if(o.type==='buy'){ h+='<div class="small">'+o.name+'　约 '+o.year+' 年到货</div>'; n++; } });
  if(!n) h+='<div class="small">（暂无）</div>';
  return h;
}
function shopBlack(){
  let h='<div class="small">黑市交易，凶险亦有机缘：掷灵石赌石，或购禁物。</div>';
  [20,50,100].forEach(c=>{ h+='<div class="shopitem"><span>赌石（耗 '+c+' 下品灵石）</span><button class="btn sm" onclick="gambleStone('+c+')">下注</button></div>'; });
  h+='<div class="mtip">—— 禁物（高风险） ——</div>';
  [['魔晶石',120],['噬魂丹',90],['血煞符',60]].forEach(it=>{ h+='<div class="shopitem"><span>'+it[0]+'（禁物）</span><button class="btn sm" onclick="buyForbidden(\''+it[0]+'\','+it[1]+')">购</button></div>'; });
  return h;
}
function consignItem(k){
  if((S.bag[k]||0)<=0) return;
  const base=HERBS[k]?HERBS[k].price:(ITEMS[k]?ITEMS[k].price:5);
  S.bag[k]--; S.orders.push({type:'sell',name:k,year:S.year+rnd(1,4),base});
  log('你将【'+k+'】交付商队寄售，约定数年后售出。','good'); renderShop();
}
function barterItem(k){
  if((S.bag[k]||0)<=0) return;
  S.bag[k]--; const pool=Object.keys(ITEMS).concat(Object.keys(HERBS)); const g=pick(pool);
  S.bag[g]=(S.bag[g]||0)+1; log('你以【'+k+'】易得【'+g+'】。','good'); renderShop();
}
function commissionHerb(n){
  const price=Math.round(HERBS[n].price*1.4)+5;
  if(S.spirit.下<price){ log('下品灵石不足，付不起定金。','bad'); return renderShop(); }
  S.spirit.下-=price; S.orders.push({type:'buy',name:n,year:S.year+rnd(1,4),base:HERBS[n].price});
  log('你委托商队代寻【'+n+'】。','good'); renderShop();
}
function gambleStone(cost){
  if(S.spirit.下<cost){ log('灵石不足，赌不起。','bad'); return renderShop(); }
  S.spirit.下-=cost; advanceTime(rnd(1,5)); const r=Math.random();
  if(r<0.3){ const g=pick(Object.keys(HERBS).filter(x=>HERBS[x].pin>=5)); S.bag[g]=(S.bag[g]||0)+1; log('💎 石皮崩裂，露出【'+g+'】一枚！大赚。','good'); }
  else if(r<0.5){ const back=Math.round(cost*(1.2+Math.random())); S.spirit.下+=back; log('赌石小赚，回灵石 '+back+'。','good'); }
  else if(r<0.65){ log('💀 切开是废石，血本无归。','bad'); }
  else { const back=Math.round(cost*0.5); S.spirit.下+=back; log('切开凡石，仅回本 '+back+'。','sys'); }
  renderShop();
}
function buyForbidden(name,price){
  if(S.spirit.下<price){ log('下品灵石不足。','bad'); return renderShop(); }
  S.spirit.下-=price; S.bag[name]=(S.bag[name]||0)+1; log('你于暗处购入禁物【'+name+'】，行事须谨慎。','sys'); renderShop();
}
function settleOrders(){
  if(!S.orders||!S.orders.length) return;
  const left=[];
  S.orders.forEach(o=>{
    if(S.year>=o.year){
      if(o.type==='sell'){ const gain=Math.round(o.base*(1.3+Math.random()*0.9)); S.spirit.下+=gain; log('📦 寄售的【'+o.name+'】售出，得下品灵石 '+gain+'。','good'); }
      else { S.bag[o.name]=(S.bag[o.name]||0)+1; log('📦 委托的【'+o.name+'】已送到，入你行囊。','good'); }
    } else left.push(o);
  });
  S.orders=left;
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  if(COMBAT) combatChoices();   // 战斗中关弹窗，须交还战斗选项，不可劫持
  else defaultChoices();
}
function buyItem(k){
  const it=ITEMS[k]; const cost=itemCost(k);
  if(!canPay(cost)){ log('资财不足，买不起【'+k+'】（需 '+costText(cost)+'）。','bad'); return renderShop(); }
  doPay(cost);
  if(it.cat==='丹药'||it.cat==='符箓'||it.cat==='礼物') S.bag[k]=(S.bag[k]||0)+1;
  else if(it.slot==='武器'){ if(S.weapon && ITEMS[S.weapon]) S.spirit.下+=Math.round(ITEMS[S.weapon].price*0.3); S.weapon=k; }
  else if(it.slot==='防具'){ if(S.armor && ITEMS[S.armor]) S.spirit.下+=Math.round(ITEMS[S.armor].price*0.3); S.armor=k; }
  else if(it.slot==='饰品'){ S.ring=k; }
  log('购入【'+k+'】（耗 '+costText(cost)+'）。','good'); renderShop(); renderAll();
}
function sellHerb(k){
  const price=Math.round(HERBS[k].price*MARKET.mult); if(!S.bag[k]||S.bag[k]<=0) return;
  S.bag[k]--; S.spirit.下+=price; log('售出【'+k+'】，得下品灵石 '+price+' 枚。','good');
  renderShop(); renderAll();
}

/* ===================== 炼丹 ===================== */
function refineHTML(){
  const isAlch = (S.prof==='丹修'||S.prof==='药修');
  let h='<p class="small">主修：'+S.prof+'。'+(isAlch?'丹/药之道有成，丹房秘炼十拿九稳，常品省一成灵石。':'非丹道出身，常品火候难控约八成二成丹；上品丹药须丹房秘炼，你无从下手。')+'</p>';
  let any=false;
  for(const k in PILL_RECIPES){
    const r=PILL_RECIPES[k];
    const hasHerbs = Object.keys(r.need).every(hn=> (S.bag[hn]||0) >= r.need[hn]);
    const need = Object.keys(r.need).map(hn=>hn+'×'+r.need[hn]).join('、');
    let costTxt, ok;
    if(r.up){ // 高品丹药：丹房秘炼，耗对应等阶灵石，仅丹/药修
      const req=r.spirit;
      costTxt='丹房秘炼·需'+S.prof+'为丹/药修 + '+req+r.up+'品灵石';
      ok = isAlch && hasHerbs && (S.spirit[r.up]||0)>=req;
    } else {
      const cost = isAlch ? Math.max(1,Math.round(r.spirit*0.9)) : r.spirit;
      costTxt='下品灵石'+cost;
      ok = hasHerbs && S.spirit.下>=cost;
    }
    h+='<div class="shopitem"><span>'+k+'（'+r.desc+'）<br><span class="small">所需：'+need+' + '+costTxt+'</span></span>'+
       (ok ? '<button class="btn sm" onclick="refinePill(\''+k+'\')">炼制</button>' : '<span class="small">'+(hasHerbs?'灵石不足':'灵草不足')+'</span>')+'</div>';
    if(ok) any=true;
  }
  if(!any) h+='<p class="small">（材料或灵石不足，先去采药或坊市筹措。）</p>';
  return h;
}
function openRefine(){ marketRefresh(); SHOP_TAB='refine'; log('你于丹炉前审视手中灵草。','sys'); renderShop(); }
function refinePill(k){
  const r=PILL_RECIPES[k];
  for(const hn in r.need){ if((S.bag[hn]||0) < r.need[hn]){ log('灵草【'+hn+'】不足，无从炼制。','bad'); return renderShop(); } }
  const isAlch=(S.prof==='丹修'||S.prof==='药修');
  if(r.up){ // 高品丹药：丹房秘炼，仅丹/药修可炼，耗对应等阶灵石
    if(!isAlch){ log('【'+k+'】乃丹房秘炼之上品，非丹道出身无从下手。','bad'); return renderShop(); }
    const req=r.spirit;
    if((S.spirit[r.up]||0) < req){ log('丹房炼【'+k+'】需'+req+r.up+'品灵石为薪，你尚不足。','bad'); return renderShop(); }
    for(const hn in r.need){ S.bag[hn]-=r.need[hn]; }
    S.spirit[r.up]-=req;
    advanceTime(rnd(5,20));
    if(Math.random()<0.9){ S.bag[k]=(S.bag[k]||0)+1; if(S.ach) S.ach.pills=(S.ach.pills||0)+1; log('丹香四溢！丹房秘炼成【'+k+'】一枚（丹道加成，稳如老狗）。','good'); }
    else log('💥 丹炉骤炸，灵草尽毁。','bad');
    renderAll(); renderShop(); return;
  }
  const cost = isAlch ? Math.max(1,Math.round(r.spirit*0.9)) : r.spirit;
  if(S.spirit.下 < cost){ log('下品灵石不足，无力生火。','bad'); return renderShop(); }
  for(const hn in r.need){ S.bag[hn]-=r.need[hn]; }
  S.spirit.下 -= cost;
  advanceTime(rnd(5,20));
  if(isAlch || Math.random()<0.82 + clamp((S.SH||0)/(S.maxShen||1),0,1)*0.1){   // V1.8：神识越盛，非丹修成丹率越高
    S.bag[k]=(S.bag[k]||0)+1; if(S.ach) S.ach.pills=(S.ach.pills||0)+1;
    log('丹香四溢！你炼成【'+k+'】一枚。'+(isAlch?'（丹道加成，稳如老狗）':''),'good');
  } else {
    log('💥 丹炉骤炸，灵草尽毁'+(isAlch?'':'（非丹道出身，火候难控）')+'。','bad');
  }
  renderAll(); renderShop();
}

/* ===================== 存档 ===================== */
function saveGame(silent){
  try{
    localStorage.setItem(SAVE_KEY+CUR_SLOT, JSON.stringify(S));
    if(!silent) log('【存档点】档位'+CUR_SLOT+'进度已记录于天地之间。','good');
  }catch(e){ log('存档失败：'+e.message,'bad'); }
}
function migrateSave(){
  if(!S) return;
  if(!S.wp) S.wp=[];
  if(!S.gongLv) S.gongLv={};
  if(!S.mainGong){
    const mg=(PROFS[S.prof]&&PROFS[S.prof].skill.name)||'引气诀';
    S.mainGong=mg; if(!S.wp.includes(mg)) S.wp.push(mg); if(!S.gongLv[mg]) S.gongLv[mg]=1;
  }
  if(!S.gongLv[S.mainGong]) S.gongLv[S.mainGong]=1;
  if(!S.spirit || typeof S.spirit!=='object') S.spirit={下:0,中:0,上:0,极:0};
  if(!S.spirit.中 && S.spirit.中!==0) S.spirit.中=0;
  if(!S.spirit.上 && S.spirit.上!==0) S.spirit.上=0;
  if(!S.spirit.极 && S.spirit.极!==0) S.spirit.极=0;
  if(!S.gold && S.gold!==0) S.gold=0;
  if(!S.pets) S.pets=[];
  S.pets.forEach(p=>{ if(p.full==null) p.full=80; });
  if(S.shopStock===undefined) S.shopStock=null;
  if(S.inherit===undefined) S.inherit=0;
  if(!S.sect) S.sect=null;
  // V1.9：单伴侣 → 多线伴侣（兼容旧档）
  if(!S.companions){ S.companions = (S.companion?[S.companion]:[]); }
  S.companion = undefined; delete S.companion;
  if(!S.friends) S.friends=[];
  if(S.jealousy===undefined) S.jealousy=null;
}
function loadGame(){
  const d=localStorage.getItem(SAVE_KEY+CUR_SLOT);
  if(!d){ log('档位'+CUR_SLOT+'尚无存档。','sys'); return; }
  S=JSON.parse(d); migrateSave(); COMBAT=null;
  log('【读档】档位'+CUR_SLOT+'时光倒流，你回到了上次存档之处。','good');
  renderAll(); defaultChoices();
}

function familyVisit(){
  if(!S.family || S.loc!==S.family.home){ log('此处非你家乡，难见双亲。','sys'); return defaultChoices(); }
  const f=S.family;
  if(f.visited){
    log('你归家探望双亲，其乐融融，气血皆舒。','good');
    S.HP=clamp(S.HP+Math.round(S.maxHP*0.15),0,S.maxHP); S.MP=clamp(S.MP+Math.round(S.maxMP*0.15),0,S.maxMP);
    advanceTime(rnd(3,5)); renderAll(); return defaultChoices();
  }
  f.visited=true;
  log('你回到家乡，见'+f.members[0].name+'（父）、'+f.members[1].name+'（母）'+(f.members[2]?('与'+f.members[2].name+'（'+f.members[2].rel+'）'):'')+'。双亲见你归来，喜极而泣。','ev');
  if(S.origin==='世家子弟'||S.origin==='宗门弟子'){ S.spirit.下+=30; log('父亲取出一囊下品灵石（30枚）与你傍身。','good'); }
  else if(S.origin==='凡人平民'){ S.gold+=50; log('母亲塞来五十两纹银，嘱咐你莫饿着。','good'); }
  else { S.bag['疗伤丹']=(S.bag['疗伤丹']||0)+1; log('家人递来一枚疗伤丹，盼你平安。','good'); }
  S.HP=clamp(S.HP+Math.round(S.maxHP*0.2),0,S.maxHP);
  advanceTime(rnd(3,5)); renderAll(); defaultChoices();
}

// 生成一位可结交之人（性别、性情、出身各异，含身世背景）
function genCandidate(){
  const sex = (S.sex==='男'?'女':'男');   // 道侣必为异性（V1.7）
  const name = genName(sex, Math.random()<0.6?'hong':'fan');
  const ident=pick(['散修游侠','宗门弟子','世家子弟','坊市商贾','丹道传人','乐坊名伶']);
  const bgMap={
    '散修游侠':'自幼漂泊江湖，剑下斩过无数妖邪，性子最厌拘束。',
    '宗门弟子':'出身二流宗门，因不甘受长辈摆布偷偷下山，心高气傲。',
    '世家子弟':'家世显赫却遭族人排挤，只身闯荡只为证明自己。',
    '坊市商贾':'走南闯北见多识广，手中消息比金银更值钱。',
    '丹道传人':'丹道世家嫡系，一手炼丹绝活足以结交天下英豪。',
    '乐坊名伶':'一曲清歌动四方，看惯人情冷暖，心思极静。',
  };
  return { name, sex, fav:rnd(10,30), rong:rnd(45,95),
    trait:pick(['温婉解语','清冷出尘','狡黠灵动','豪爽疏朗','端方守礼','孤高自许']),
    ident, bg:bgMap[ident],
    married:false };
}
// V1.9 多线伴侣辅助
function marriedCompanions(){ return (S.companions||[]).filter(c=>c.married); }
function pursuingCount(){ return (S.companions||[]).filter(c=>!c.married).length; }
function findCompanion(name){ return (S.companions||[]).find(c=>c.name===name); }
function removeCompanion(c){ const i=S.companions.indexOf(c); if(i>=0) S.companions.splice(i,1); }
function primaryCompanion(){ const mc=marriedCompanions(); return mc.length?mc[0]:null; }
// V1.9 伴侣序号：第 N 任道侣 / 缘法第 N 位
function ordCn(n){ const d=['','一','二','三','四','五','六','七','八','九','十']; if(n<=10) return d[n]; if(n<20) return '十'+(d[n-10]||''); return ''+n; }
function marriedRank(name){ const mc=marriedCompanions(); const i=mc.findIndex(c=>c.name===name); return i>=0?i+1:0; }
function social(){
  if(S.age<ADULT_AGE){ log('你尚且年幼，情缘之事无从谈起。（及冠之后自有姻缘）','sys'); return defaultChoices(); }
  if(S.EN<3){ log('倦怠，无心交际。','sys'); return defaultChoices(); }
  S.EN-=3; advanceTime(rnd(1,2));
  const n=rnd(2,3), cands=[];
  for(let i=0;i<n;i++) cands.push(genCandidate());
  log('城中灯火如昼，你可结交之人有 '+n+' 位：','ev');
  const list=cands.map(c=>({t:'结识【'+c.name+'】（'+c.sex+'·'+c.ident+'·'+c.trait+'·容貌'+c.rong+'）', act:()=>{
    eventPopup('🌸 与【'+c.name+'】相交', '<p>'+c.name+'（'+c.ident+'）：'+c.bg+'</p><p>欲以何种身份相交？（可多线并行攻略道侣，然并行愈众、情分衰减愈速，甚或惹争风吃醋）</p>', [
      {t:'结为道侣（纳入追求，初识好感'+Math.round(c.fav)+'）', act:()=>{ S.companions.push(c); if(S.ach) S.ach.companion=true; log('你与【'+c.name+'】搭话相谈，'+c.trait+'，初识好感 '+Math.round(c.fav)+'。','ev'); afterSocial(); }},
      {t:'结为好友（知己，入「人际」）', act:()=>{ if(!S.friends.find(f=>f.name===c.name)) S.friends.push({name:c.name,sex:c.sex,ident:c.ident,bg:c.bg,trait:c.trait}); log('你与【'+c.name+'】结为知己好友，君子之交。','good'); afterSocial(); }},
      {t:'再看看他人', act:()=>social()},
    ]);
  }}));
  if(S.companions.length||S.friends.length) list.push({t:'前往「人际」一览旧识', act:openInterpersonal});
  list.push({t:'今日无心风月，独自散心', act:()=>{log('你自斟自饮，未与谁搭话。','sys');defaultChoices();}});
  setChoices(list); return;
}
function afterSocial(){ defaultChoices(); }
function openGiftMenu(idx){
  let c = (idx!=null && S.companions[idx]) ? S.companions[idx] : (pursuingCount()? S.companions.find(x=>!x.married) : primaryCompanion());
  if(!c){ log('你尚无意中人，礼物先收着（可作人情）。','sys'); return afterSocial(); }
  const gifts=Object.keys(S.bag).filter(k=>S.bag[k]>0 && ITEMS[k] && ITEMS[k].cat==='礼物');
  if(!gifts.length){ log('你行囊中并无可赠之礼（可于坊市购得玉簪、琴瑟等）。','sys'); return afterSocial(); }
  const list=gifts.map(k=>({t:'赠【'+k+'】（好感+'+(ITEMS[k].gift||10)+'）', act:()=>{ S.bag[k]--; c.fav=Math.min(99,c.fav+(ITEMS[k].gift||10)); log('你赠【'+k+'】予'+c.name+'，'+c.name+'喜形于色（好感'+Math.round(c.fav)+'）。','good'); afterSocial(); }}));
  list.push({t:'还是不送了', act:afterSocial});
  setChoices(list);
}
// V1.9 单伴侣互动菜单（来自「人际」）
function openCompanionMenu(idx){
  const c=S.companions[idx]; if(!c) return openInterpersonal();
  if(!c.married){
    log('你与【'+c.name+'】（'+c.sex+'·'+c.ident+'·'+c.trait+'）情谊日笃，好感 '+Math.round(c.fav)+'。','sys');
    setChoices([
      {t:'求结为道侣（需好感≥60）',act:()=>{ if(c.fav>=60){c.married=true; const rk=marriedRank(c.name); log('🌸 你与【'+c.name+'】结为第'+ordCn(rk)+'任道侣，山盟海誓，三界为证。','good');openInterpersonal();}else{log('时机未到，'+c.name+'尚踌躇（好感'+Math.round(c.fav)+'/60）。','bad');openCompanionMenu(idx);}}},
      {t:'赠以灵石（耗20下灵石，好感+12）',act:()=>{ if(S.spirit.下>=20){S.spirit.下-=20;c.fav+=12;log('你赠灵石二十，'+c.name+'浅笑收纳。','good');}else log('灵石不足，无以相赠。','bad'); openCompanionMenu(idx); }},
      {t:'赠以礼物（好感大增）',act:()=>openGiftMenu(idx)},
      {t:'相伴游历（好感+8~12）',act:()=>{c.fav+=rnd(8,12);log('你们把酒言欢，情意更浓（好感'+Math.round(c.fav)+'）。','good');openCompanionMenu(idx);}},
      {t:'另寻新欢（好聚好散）',act:()=>{ removeCompanion(c); log('你与【'+c.name+'】好聚好散，各自转身。','sys'); openInterpersonal(); }},
      {t:'返回人际',act:openInterpersonal},
    ]);
  } else {
    log('你与道侣【'+c.name+'】（好感'+Math.round(c.fav)+'）琴瑟和鸣。','sys');
    setChoices([
      {t:'与之双修（修为/好感俱增）',act:()=>{ if(S.EN<8){log('体力不济，双修无从谈起。','bad');openCompanionMenu(idx);return;} S.EN-=8; advanceTime(rnd(3,8)); const g=(1.2+S.wu/50)*rnd(4,8); S.prog=clamp(S.prog+g,0,100); c.fav=Math.min(99,c.fav+6); log('🌸 你与【'+c.name+'】双修参道，灵犀相通，修为 +'+g.toFixed(1)+'%，情意更浓。','good'); if(S.prog>=100&&(S.ri<8||(S.ri===8&&S.si<3))) tryBreakPrompt(); else openCompanionMenu(idx); }},
      {t:'共度良宵，盼结珠胎',act:()=>haveChild(c)},
      {t:'比翼同游',act:()=>{c.fav=Math.min(99,c.fav+rnd(3,7));log('你们携手同游，神仙眷侣。','good');openCompanionMenu(idx);}},
      {t:'返回人际',act:openInterpersonal},
    ]);
  }
}

function haveChild(parentC){
  const mc = marriedCompanions();
  if(!mc.length){ log('尚无道侣，何来子嗣。','sys'); return defaultChoices(); }
  const c = parentC || (mc.length===1 ? mc[0] : null);
  if(!c){
    const list=mc.map(x=>({t:'与【'+x.name+'】求子', act:()=>haveChild(x)}));
    list.push({t:'作罢', act:defaultChoices});
    setChoices(list); return;
  }
  if(S.后代 && S.后代.length>=4){ log('你子嗣已众（'+S.后代.length+' 名），天伦已足，暂不添丁。','sys'); return defaultChoices(); }
  advanceTime(rnd(2,6));
  const chance = clamp(0.45 + (S.mei-50)/200 + (S.fu-50)/250, 0.25, 0.85);
  if(Math.random()>chance){ log('此番未能结胎，只道缘分未至（魅力'+S.mei+'·福缘'+S.fu+'）。','sys'); return defaultChoices(); }
  const n = Math.random()<0.15 ? 2 : 1;   // 双胎之喜
  const base = S.后代.length, born=[];
  for(let i=0;i<n;i++){
    const sex=Math.random()<0.5?'男':'女';
    const rootq=pick(['天灵根','双灵根','三灵根','四灵根','五灵根']);
    const child={ name:genName(sex,'fan'), sex, root:pick(ROOTS), rootq, parent:c.name,
      gen:(rootq==='天灵根')?rnd(70,95):rnd(40,78),
      wu:(rootq==='天灵根')?rnd(68,90):rnd(38,75) };

  h+='<div class="mtip">—— 赐予装备 ——</div>';
  if(eqs.length) eqs.forEach(k=>{ h+='<div class="shopitem"><span>'+k+'</span><button class="btn sm" onclick="doEquipPet('+idx+',\''+k+'\')">赐</button></div>'; });
  else h+='<div class="small">（行囊无装备）</div>';
  h+='<p class="small">当前装备：武器 '+(p.equip.武器||'无')+' / 防具 '+(p.equip.防具||'无')+'　｜　灵草增益：喂养时按灵草品阶提升经验、忠诚与饱食度。</p>';
  h+='<div class="center" style="margin-top:10px"><button class="btn" onclick="openPet()">返回</button><button class="btn ghost" onclick="closeModal()">关闭</button></div>';
  box.innerHTML=h; document.getElementById('modal').classList.add('show');
}
function doFeedPet(idx,k){
  const p=S.pets[idx]; if(!p||!S.bag[k]) return;
  S.bag[k]--; const pin=HERBS[k].pin;
  p.exp+=pin*8; p.loyalty=clamp(p.loyalty+pin*3,0,100); p.full=clamp((p.full||0)+pin*12,0,100);
  let msg='你以【'+k+'】喂养'+p.name+'，经验 +'+(pin*8)+'，忠诚 +'+(pin*3)+'，饱食 +'+(pin*12)+'。';
  if(p.exp>=p.lv*60){ p.lv++; p.exp=0; msg+=' '+p.name+'进阶至 Lv'+p.lv+'！'; }
  log('🐾 '+msg,'good'); renderAll(); feedPet(idx);
}
function doEquipPet(idx,k){
  const p=S.pets[idx]; if(!p||!S.bag[k]) return;
  const slot=ITEMS[k].slot;
  if(p.equip[slot]) S.bag[p.equip[slot]]=(S.bag[p.equip[slot]]||0)+1;
  S.bag[k]--; p.equip[slot]=k;
  log('🐾 你赐【'+k+'】予'+p.name+'（'+slot+'）。','good'); renderAll(); feedPet(idx);
}
